cvph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9pt; font-weight:800; color:#9a9a9a; letter-spacing:.1em; text-transform:uppercase; }\n.cvt{ position:absolute; left:2.5mm; top:2.5mm; display:flex; flex-wrap:wrap; gap:1.5mm; }\n.tg{ font-size:6.5pt; font-weight:800; padding:1mm 2.2mm; border-radius:99px; background:#fff; }\n.tg.y{ background:#f6b119; } .tg.dark{ background:#0a0a0a; color:#fff; }\n.cvb{ padding:3.5mm; }\n.cvn{ font-size:8.5pt; font-weight:800; line-height:1.3; min-height:7mm; }\n.cvg{ display:grid; grid-template-columns:1fr 1fr; gap:2.5mm; margin-top:3mm; }\n.cvg b{ display:block; font-size:10pt; font-weight:800; } .cvg span{ display:block; font-size:6.5pt; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#6b6b6b; }\n.chart{ display:flex; align-items:flex-end; gap:3mm; height:62mm; padding-top:7mm; border-bottom:1.5px solid #0a0a0a; }\n.cc{ flex:1; min-width:0; display:flex; flex-direction:column; height:100%; }\n.cbw{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; }\n.cb{ width:100%; max-width:14mm; background:#0a0a0a; border-radius:1.5mm 1.5mm 0 0; } .cb.last{ background:#f6b119; }\n.cval{ font-size:7pt; font-weight:800; margin-bottom:1.5mm; white-space:nowrap; }\n.clab{ font-size:7pt; font-weight:700; text-align:center; margin-top:2mm; color:#444; }\n.cl2{ font-size:6.5pt; text-align:center; color:#9a9a9a; }\n.camps{ display:grid; grid-template-columns:1fr 1fr; gap:4mm; margin-top:7mm; }\n.camp{ background:#f4f4f4; border-radius:3mm; padding:4mm; }\ntable{ width:100%; border-collapse:collapse; font-size:8pt; }\nthead{ display:table-header-group; }\nth{ text-align:left; font-size:6.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#6b6b6b; padding:2mm 2mm; border-bottom:1.5px solid #0a0a0a; }\ntd{ padding:2.2mm 2mm; border-bottom:1px solid #ececec; }\ntr{ break-inside:avoid; }\ntd.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; } td.nm{ font-weight:700; }\n.sales{ display:grid; grid-template-columns:repeat(2,1fr); gap:4mm; }\n.sale{ background:#f4f4f4; border-radius:3mm; padding:4mm; border-top:1.2mm solid #1f9d55; break-inside:avoid; }\n.sc{ font-size:11pt; font-weight:800; } .sv{ font-size:8.5pt; color:#6b6b6b; margin:1mm 0 3mm; }\n.sr{ display:flex; justify-content:space-between; gap:3mm; font-size:8.5pt; padding:1.5mm 0; border-top:1px solid #e2e2e2; } .sr span{ color:#6b6b6b; }\n.sts{ display:flex; gap:3mm; flex-wrap:wrap; margin-bottom:4mm; }\n.stc{ display:flex; align-items:center; gap:2mm; background:#f4f4f4; border-radius:99px; padding:1mm 3mm 1mm 1mm; font-size:9pt; } .stc b{ font-weight:800; }\n.pill{ font-size:7pt; font-weight:700; padding:1mm 2.5mm; border-radius:99px; white-space:nowrap; }\n.pill.fe{ background:#e7f6ee; color:#14703b; } .pill.pe{ background:#fdf3d7; color:#8a5d00; } .pill.vi{ background:#e7f1fc; color:#1864ab; } .pill.pd{ background:#fde8e8; color:#a61e1e; }\n.als{ display:flex; flex-direction:column; gap:2.5mm; }\n.al{ display:flex; gap:3mm; background:#f4f4f4; border-radius:3mm; padding:3.5mm 4mm; font-size:9.5pt; line-height:1.5; break-inside:avoid; } .al i{ width:2.6mm; height:2.6mm; border-radius:50%; flex-shrink:0; margin-top:1.4mm; } .al b{ font-weight:800; }\n.empty{ color:#9a9a9a; font-size:9pt; }\n.foot{ margin-top:10mm; padding-top:3mm; border-top:1px solid #e2e2e2; display:flex; justify-content:space-between; font-size:7.5pt; color:#9a9a9a; font-weight:600; }\n@media screen{ body{ background:#e9e9e9; } .doc{ width:210mm; margin:10mm auto; background:#fff; padding:14mm; box-shadow:0 4px 20px rgba(0,0,0,.12); } }\n<\u002Fstyle><\u002Fhead><body><div class=\"doc\">\n<div class=\"cover\">\n  ${logo?`<img class=\"lg\" src=\"${logo}\" alt=\"Beekeeper\">`:'<div style=\"font-size:18pt;font-weight:800;letter-spacing:.16em;color:#f6b119\">BEEKEEPER<\u002Fdiv>'}\n  <div class=\"ey\"><i><\u002Fi>Relatório de campanha<\u002Fdiv>\n  <h1>${esc(client.name)}<\u002Fh1>\n  <div class=\"st\">${esc(client.subtitle||'')}<\u002Fdiv>\n  <div class=\"meta2\">\n    <div><span>Período<\u002Fspan><b>${esc(period)}<\u002Fb><\u002Fdiv>\n    <div><span>Investido<\u002Fspan><b>${fmtBRL(T.spend)}<\u002Fb><\u002Fdiv>\n    <div><span>Leads<\u002Fspan><b>${T.leads}<\u002Fb><\u002Fdiv>\n    <div><span>Emitido em<\u002Fspan><b>${today}<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stripe\"><\u002Fdiv>\n<\u002Fdiv>\n${parts.join('\\n')}\n<div class=\"foot\"><span>Beekeeper Agência de Marketing · ${esc(client.name)}<\u002Fspan><span>Fonte: ${esc(client.source||'Meta Ads Manager')} · ${esc(period)}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbody><\u002Fhtml>`;\n  frame.srcdoc = html;\n}\n\n\n\n/* ---------- v2: métricas de mídia, galeria de criativos, alertas, backup completo ---------- */\nfunction fmtInt(v){ return v==null ? '—' : Math.round(v).toLocaleString('pt-BR'); }\nfunction fmtBRL0(v){ return 'R$ ' + Math.round(v||0).toLocaleString('pt-BR'); }\nfunction escA(s){ return esc(s).replace(/\"/g,'&quot;'); }\nfunction setHTML(id, h){ const el=document.getElementById(id); if(el) el.innerHTML = h; }\nfunction optNum(id){ const el=document.getElementById(id); return el && el.value!=='' ? parseFloat(el.value) : null; }\nfunction isoD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction brDate(s){ return s ? s.split('-').reverse().join('/') : ''; }\n\n/* menus */\nfunction closeMenus(){ document.querySelectorAll('details.menu[open]').forEach(d=>d.removeAttribute('open')); }\ndocument.addEventListener('click', e=>{ if(!e.target.closest('details.menu')) closeMenus(); });\ndocument.querySelectorAll('details.menu').forEach(d=>d.addEventListener('toggle', ()=>{ if(d.open) document.querySelectorAll('details.menu[open]').forEach(o=>{ if(o!==d) o.removeAttribute('open'); }); }));\n\n/* imagens dos criativos (IndexedDB) */\nlet thumbCache = {}, thumbTarget = null;\nfunction tdb(){ if(!tdb.p) tdb.p = new Promise((res,rej)=>{ const r=indexedDB.open('bk_camp_thumbs',1); r.onupgradeneeded=()=>r.result.createObjectStore('t'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return tdb.p; }\nasync function tdbAll(){ const d=await tdb(); return new Promise(res=>{ const out={}; const tx=d.transaction('t'); const c=tx.objectStore('t').openCursor(); c.onsuccess=()=>{ const k=c.result; if(k){ out[k.key]=k.value; k.continue(); } }; tx.oncomplete=()=>res(out); tx.onerror=()=>res(out); }); }\nasync function tdbPut(k,v){ const d=await tdb(); return new Promise((res,rej)=>{ const tx=d.transaction('t','readwrite'); if(v==null) tx.objectStore('t').delete(k); else tx.objectStore('t').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }\nfunction thumbKey(name){ return getCurrentClient().id+'|'+name; }\nfunction pickThumb(name){ thumbTarget = name; document.getElementById('thumbFile').click(); }\nfunction fileToThumb(file){\n  return new Promise((res,rej)=>{\n    const url = URL.createObjectURL(file);\n    const done = (el,w,h)=>{ const W=520, H=Math.round(h*W/w)||W; const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(el,0,0,W,H); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.8)); };\n    if(file.type.startsWith('video')){\n      const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto';\n      v.onloadeddata=()=>{ v.currentTime=Math.min(1,(v.duration||3)/3); };\n      v.onseeked=()=>done(v,v.videoWidth,v.videoHeight);\n      v.onerror=()=>rej(new Error('formato de vídeo não suportado'));\n      v.src=url;\n    } else {\n      const i=new Image(); i.onload=()=>done(i,i.naturalWidth,i.naturalHeight); i.onerror=()=>rej(new Error('imagem inválida')); i.src=url;\n    }\n  });\n}\nasync function onThumbFile(e){\n  const f=e.target.files[0]; e.target.value=''; if(!f || !thumbTarget) return;\n  try{ const src=await fileToThumb(f); const k=thumbKey(thumbTarget), v={src, video:f.type.startsWith('video')}; await tdbPut(k,v); thumbCache[k]=v; renderGallery(); }\n  catch(err){ alert('Não foi possível ler o arquivo: '+err.message); }\n}\nasync function removeThumb(name){ if(!confirm('Remover a imagem deste criativo?')) return; const k=thumbKey(name); await tdbPut(k,null); delete thumbCache[k]; renderGallery(); }\n\n/* período anterior */\nfunction prevRange(){\n  if(!filterFrom || !filterTo) return null;\n  const f=new Date(filterFrom+'T00:00:00'), t=new Date(filterTo+'T00:00:00');\n  const len=Math.round((t-f)/864e5)+1; const pt=new Date(f); pt.setDate(pt.getDate()-1); const pf=new Date(pt); pf.setDate(pf.getDate()-len+1);\n  return {from:isoD(pf), to:isoD(pt)};\n}\nfunction anunciosBetween(from,to){ return getCurrentClient().anuncios.filter(a=>{ const s=a.dateStart, e=a.dateEnd||a.dateStart; return s<=to && e>=from; }); }\nfunction deltaHTML(cur, prev, lowerIsBetter){\n  if(cur==null || prev==null || !isFinite(prev) || prev===0 || !isFinite(cur)) return '';\n  const p=(cur/prev-1)*100;\n  const cls = Math.abs(p)<1 || lowerIsBetter==null ? 'flat' : ((lowerIsBetter ? p<0 : p>0) ? 'up' : 'down');\n  return `<span class=\"delta ${cls}\">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p).toFixed(0)}% vs anterior<\u002Fspan>`;\n}\n\nfunction mediaTotals(an, cr){\n  const s=k=>an.reduce((t,a)=>t+(+a[k]||0),0), has=k=>an.some(a=>a[k]!=null);\n  const impr=s('impr'), spend=s('spend'), leads=s('leads');\n  const reach=has('reach')?s('reach'):null, clicks=has('linkClicks')?s('linkClicks'):null, v3=has('views3s')?s('views3s'):null, thru=has('thruplay')?s('thruplay'):null;\n  const w=k=>{ let n=0,d=0; cr.forEach(c=>{ if(c[k]!=null && c.spend>0){ n+=c[k]*c.spend; d+=c.spend; } }); return d ? n/d : null; };\n  const vidImpr = an.filter(a=>a.views3s!=null).reduce((t,a)=>t+(+a.impr||0),0);\n  return { impr, spend, leads, reach, clicks, v3, thru,\n    cpm: impr ? spend/impr*1000 : null,\n    freq: w('freq') ?? (reach ? impr/reach : null),\n    ctrLink: clicks!=null && impr ? clicks/impr*100 : w('ctrLink'),\n    ctrAll: w('ctrAll'),\n    cpc: clicks ? spend/clicks : w('cpc'),\n    hook: v3!=null && vidImpr ? v3/vidImpr*100 : null,\n    hold: thru!=null && v3 ? thru/v3*100 : null };\n}\n\nfunction renderMedia(T, P, pr){\n  const D=(k,lower)=>P ? deltaHTML(T[k], P[k], lower) : '';\n  const items = [\n    ['Impressões', fmtInt(T.impr), 'vezes que os anúncios apareceram', D('impr',false)],\n    ['Alcance', fmtInt(T.reach), T.reach==null ? 'importe um CSV com a coluna Alcance' : 'pessoas, somando os períodos', D('reach',false)],\n    ['Frequência', fmtNum(T.freq), 'vezes que cada pessoa viu', D('freq',null)],\n    ['CPM', T.cpm!=null?fmtBRL(T.cpm):'—', 'custo por mil impressões', D('cpm',true)],\n    ['CTR (link)', fmtPct(T.ctrLink), 'cliques no botão ÷ impressões', D('ctrLink',false)],\n    ['CTR (todos)', fmtPct(T.ctrAll), 'qualquer interação com o anúncio', D('ctrAll',false)],\n    ['CPC', T.cpc!=null?fmtBRL(T.cpc):'—', 'custo por clique', D('cpc',true)],\n    ['Views 3s', fmtInt(T.v3), T.hook!=null ? 'hook rate '+fmtPct(T.hook) : 'importe um CSV com reproduções de 3s', D('v3',false)],\n    ['ThruPlay', fmtInt(T.thru), T.hold!=null ? 'hold rate '+fmtPct(T.hold) : 'vídeo assistido até o fim ou 15s', D('thru',false)]\n  ];\n  setHTML('mediaGrid', items.map(i=>`<div class=\"mcard\"><div class=\"ml\">${i[0]}<\u002Fdiv><div class=\"mv\">${i[1]}<\u002Fdiv><div class=\"ms\">${i[2]}<\u002Fdiv>${i[3]}<\u002Fdiv>`).join(''));\n  setHTML('mediaMeta', P ? 'comparado com '+brDate(pr.from)+' a '+brDate(pr.to) : (pr ? 'sem dados no período anterior para comparar' : 'escolha um período para comparar com o anterior'));\n}\n\nfunction alertsList(cr, T, meta){\n  const out=[];\n  const avg = T.leads ? T.spend/T.leads : null;\n  if(meta && avg!=null && avg>meta) out.push(['#e03131', `<b>CPL do período (${fmtBRL(avg)}) está acima da meta de ${fmtBRL(meta)}.<\u002Fb>`]);\n  cr.filter(c=>c.leads===0 && c.spend>=Math.max(20, avg||0)).sort((a,b)=>b.spend-a.spend).slice(0,4)\n    .forEach(c=>out.push(['#e03131', `<b>${esc(c.name)}<\u002Fb> gastou ${fmtBRL(c.spend)} sem gerar lead. Avalie pausar.`]));\n  cr.filter(c=>c.fatigue).forEach(c=>out.push(['#f08c00', `<b>Fadiga em ${esc(c.name)}:<\u002Fb> ${esc(c.fatigue)}.`]));\n  const hooks = cr.filter(c=>c.hook!=null && c.impr>=500);\n  if(hooks.length>=2){ const lo=hooks.slice().sort((a,b)=>a.hook-b.hook)[0]; if(lo.hook<20) out.push(['#f6b119', `<b>${esc(lo.name)}<\u002Fb> prende pouco nos 3 primeiros segundos (hook ${fmtPct(lo.hook)}). Teste outro gancho.`]); }\n  const elig = cr.filter(c=>c.leads>=2 && c.cpl!=null);\n  if(elig.length){ const b=elig.slice().sort((x,y)=>x.cpl-y.cpl)[0]; out.push(['#1f9d55', `<b>Melhor CPL: ${esc(b.name)}<\u002Fb>, ${fmtBRL(b.cpl)} com ${b.leads} leads. Considere colocar mais verba nele.`]); }\n  return out;\n}\nfunction renderAlerts(cr, T, meta){\n  const out = alertsList(cr, T, meta);\n  if(!out.length) out.push(['#1f9d55', 'Nenhum ponto de atenção no período.']);\n  setHTML('alertsBox', out.map(a=>`<div class=\"alert\"><i style=\"background:${a[0]}\"><\u002Fi><span>${a[1]}<\u002Fspan><\u002Fdiv>`).join(''));\n}\n\nfunction renderCallout(T){\n  const f=T.freq;\n  setHTML('calloutText', f==null ? 'Importe um CSV com a coluna Frequência para avaliar se o público está saturado.'\n    : f<=1.8 ? `Frequência média de <b>${fmtNum(f)}<\u002Fb>: o público <b>não<\u002Fb> está saturado. Quedas pontuais de performance tendem a ser custo de leilão (CPC), não fadiga de criativo. Confira o CPC antes de trocar um anúncio por \"cansaço\".`\n    : f<=2.5 ? `Frequência média de <b>${fmtNum(f)}<\u002Fb>: o público começa a ver os anúncios repetidas vezes. Acompanhe o CTR e o CPL dos criativos mais antigos.`\n    : `Frequência média de <b>${fmtNum(f)}<\u002Fb>: público saturado. Renove os criativos ou amplie o público.`);\n}\n\nlet gallerySort = 'leads';\nlet viewMode = localStorage.getItem('bk_camp_view') || 'gallery';\nfunction setGallerySort(v){ gallerySort = v; renderGallery(); }\nfunction setView(v){ viewMode = v; try{ localStorage.setItem('bk_camp_view', v); }catch(e){} applyView(); }\nfunction applyView(){\n  const g=document.getElementById('galleryBox'), t=document.getElementById('secTable'), s=document.getElementById('gallerySort');\n  if(g) g.style.display = viewMode==='gallery' ? '' : 'none';\n  if(s) s.style.display = viewMode==='gallery' ? '' : 'none';\n  if(t) t.style.display = viewMode==='table' ? '' : 'none';\n  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.v===viewMode));\n}\n\nfunction renderGallery(cr, meta){\n  const box=document.getElementById('galleryBox'); if(!box) return;\n  if(!cr){ cr=aggregateCreatives(getFilteredAnuncios()); meta=+getCurrentClient().cplMeta||0; }\n  if(!cr.length){ box.innerHTML='<div class=\"empty-note\" style=\"grid-column:1/-1;background:#fff;border-radius:12px\">Nenhum criativo no período. Importe o CSV do Gerenciador de Anúncios.<\u002Fdiv>'; return; }\n  const key=gallerySort, asc = key==='cpl' || key==='cpm';\n  const list = cr.slice().sort((a,b)=>{ const va=a[key], vb=b[key]; if(va==null && vb==null) return b.leads-a.leads; if(va==null) return 1; if(vb==null) return -1; return asc ? va-vb : vb-va; });\n  const elig = cr.filter(c=>c.leads>=2 && c.cpl!=null);\n  const best = elig.length ? elig.reduce((m,c)=>c.cpl<m.cpl?c:m).name : null;\n  const zero = cr.filter(c=>c.leads===0 && c.spend>0);\n  const worst = zero.length ? zero.reduce((m,c)=>c.spend>m.spend?c:m).name : (elig.length>1 ? elig.reduce((m,c)=>c.cpl>m.cpl?c:m).name : null);\n  const top = cr.reduce((m,c)=>c.leads>m.leads?c:m, cr[0]);\n  const up = '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12\"><\u002Fpath><\u002Fsvg>';\n  box.innerHTML = list.map(c=>{\n    const t=thumbCache[thumbKey(c.name)], n=escA(c.name), b=[];\n    if(c.name===best) b.push('<span class=\"badge best\">Melhor CPL<\u002Fspan>');\n    if(top.leads>0 && c.name===top.name && c.name!==best) b.push('<span class=\"badge top\">Mais leads<\u002Fspan>');\n    if(c.name===worst && c.name!==best) b.push('<span class=\"badge worst\">'+(c.leads===0?'Sem leads':'Pior CPL')+'<\u002Fspan>');\n    if(c.fatigue) b.push('<span class=\"badge fat\">Fadiga<\u002Fspan>');\n    const cc = meta && c.cpl!=null ? (c.cpl<=meta?'good':'bad') : '';\n    const ms=[['CTR link',fmtPct(c.ctrLink)],['CPM',c.cpm!=null?fmtBRL(c.cpm):'—'],['Freq.',fmtNum(c.freq)],['CPC',c.cpc!=null?fmtBRL(c.cpc):'—'],['Impr.',fmtInt(c.impr)],['Alcance',fmtInt(c.reach)]];\n    if(c.views3s!=null) ms.push(['Views 3s',fmtInt(c.views3s)]);\n    if(c.hook!=null) ms.push(['Hook',fmtPct(c.hook)]);\n    if(c.hold!=null) ms.push(['Hold',fmtPct(c.hold)]);\n    const ret = c.ret && c.ret.some(x=>x>0) ? '<div class=\"cv-ret\">'+['25%','50%','75%','100%'].map((l,i)=>`<div class=\"cv-rr\"><span>${l}<\u002Fspan><div class=\"cv-rt\"><div style=\"width:${Math.min(100,c.ret[i]||0).toFixed(0)}%\"><\u002Fdiv><\u002Fdiv><b>${fmtPct(c.ret[i])}<\u002Fb><\u002Fdiv>`).join('')+'<\u002Fdiv>' : '';\n    return `<div class=\"cv\">\n      <div class=\"cv-media\" data-name=\"${n}\" onclick=\"pickThumb(this.dataset.name)\" title=\"${t?'Trocar imagem':'Adicionar imagem ou vídeo do criativo'}\">\n        ${t ? `<img src=\"${t.src}\" alt=\"\">`+(t.video?'<div class=\"cv-play\"><span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>':'') : `<div class=\"cv-ph\">${up}<span>Adicionar imagem ou vídeo<\u002Fspan><\u002Fdiv>`}\n        <div class=\"cv-badges\">${b.join('')}<\u002Fdiv>\n        <span class=\"cv-type\">${c.campaign==='imagem'?'Imagem':'Vídeo'}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cv-body\">\n        <div class=\"cv-name\">${esc(c.name)}<\u002Fdiv>\n        <div class=\"cv-main\"><div><b>${c.leads}<\u002Fb><span>Leads<\u002Fspan><\u002Fdiv><div><b class=\"${cc}\">${c.cpl!=null?fmtBRL(c.cpl):'—'}<\u002Fb><span>CPL<\u002Fspan><\u002Fdiv><div><b>${fmtBRL0(c.spend)}<\u002Fb><span>Gasto<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"cv-ms\">${ms.map(m=>`<div class=\"cv-m\"><span>${m[0]}<\u002Fspan><b>${m[1]}<\u002Fb><\u002Fdiv>`).join('')}<\u002Fdiv>\n        ${ret}\n        ${c.fatigue?`<div class=\"cv-warn\">${esc(c.fatigue)}<\u002Fdiv>`:''}\n        ${t?`<div class=\"cv-foot\"><button data-name=\"${n}\" onclick=\"removeThumb(this.dataset.name)\">remover imagem<\u002Fbutton><\u002Fdiv>`:''}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction setCplMeta(){\n  const c=getCurrentClient();\n  const v=prompt('Meta de custo por lead (CPL) para '+c.name+', em R$. Deixe vazio para remover.', c.cplMeta ? String(c.cplMeta).replace('.',',') : '');\n  if(v===null) return;\n  const n=parseFloat(String(v).replace(/\\./g,'').replace(',','.'));\n  c.cplMeta = isNaN(n) || n<=0 ? null : n;\n  saveData(); render();\n}\n\nasync function exportAll(){\n  let thumbs={}; try{ thumbs=await tdbAll(); }catch(e){}\n  const blob=new Blob([JSON.stringify({app:'beekeeper-campanhas', version:2, exportedAt:new Date().toISOString(), data:DATA, thumbs})], {type:'application/json'});\n  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='beekeeper-campanhas-backup-'+isoD(new Date())+'.json';\n  document.body.appendChild(a); a.click(); a.remove();\n}\n\nfunction pdfMediaRow(an){\n  const T=mediaTotals(an, aggregateCreatives(an));\n  return [['Impressões',fmtInt(T.impr)],['Alcance',fmtInt(T.reach)],['CPM',T.cpm!=null?fmtBRL(T.cpm):'—'],['CTR (link)',fmtPct(T.ctrLink)],['Hook rate',fmtPct(T.hook)]]\n    .map(k=>`<div class=\"kpi\"><div class=\"v\">${k[1]}<\u002Fdiv><div class=\"l\">${k[0]}<\u002Fdiv><\u002Fdiv>`).join('');\n}\n\nfunction renderV2(){\n  const client=getCurrentClient(), an=getFilteredAnuncios(), orc=getFilteredOrcamentos(), cr=aggregateCreatives(an);\n  const pr=prevRange(); let pAn=null, pOrc=null;\n  if(pr){ pAn=anunciosBetween(pr.from, pr.to); if(!pAn.length) pAn=null; pOrc=client.orcamentos.filter(o=>o.date>=pr.from && o.date<=pr.to); }\n  const T=mediaTotals(an, cr), P=pAn ? mediaTotals(pAn, aggregateCreatives(pAn)) : null;\n  const nO=orc.length, nV=orc.filter(o=>o.status==='Fechado').length;\n  const pO=pOrc?pOrc.length:0, pV=pOrc?pOrc.filter(o=>o.status==='Fechado').length:0;\n  setHTML('dGasto', P ? deltaHTML(T.spend, P.spend, null) : '');\n  setHTML('dCPL', P ? deltaHTML(T.leads?T.spend/T.leads:null, P.leads?P.spend/P.leads:null, true) : '');\n  setHTML('dCPO', P && pO ? deltaHTML(nO?T.spend/nO:null, P.spend/pO, true) : '');\n  setHTML('dCPV', P && pV ? deltaHTML(nV?T.spend/nV:null, P.spend/pV, true) : '');\n  const meta=+client.cplMeta||0, cpl=T.leads ? T.spend/T.leads : null;\n  setHTML('kCPLMeta', meta\n    ? `<div class=\"meta-line\" onclick=\"setCplMeta()\" title=\"Alterar meta\"><i style=\"background:${cpl==null?'#9a9a9a':cpl<=meta?'#1f9d55':cpl<=meta*1.2?'#f6b119':'#e03131'}\"><\u002Fi>Meta ${fmtBRL(meta)} · ${cpl==null?'sem leads':cpl<=meta?'dentro da meta':cpl<=meta*1.2?'até 20% acima':'acima da meta'}<\u002Fdiv>`\n    : `<div class=\"meta-line\" onclick=\"setCplMeta()\" style=\"color:#8a8a8a\">+ definir meta de CPL<\u002Fdiv>`);\n  renderMedia(T, P, pr);\n  renderAlerts(cr, T, meta);\n  renderCallout(T);\n  renderGallery(cr, meta);\n  applyView();\n}\n\nconst _renderBase = render;\nrender = function(){ _renderBase(); try{ renderV2(); }catch(e){ console.error(e); } };\n\nconst _confirmRenameBase = confirmRename;\nconfirmRename = function(){\n  const o=document.getElementById('rn_old').value, n=document.getElementById('rn_new').value.trim();\n  const before=getCurrentClient().anuncios.filter(a=>a.name===o).length;\n  _confirmRenameBase();\n  const after=getCurrentClient().anuncios.filter(a=>a.name===o).length;\n  if(o && n && before && !after){\n    const ko=thumbKey(o), kn=thumbKey(n);\n    if(thumbCache[ko]){ if(!thumbCache[kn]){ thumbCache[kn]=thumbCache[ko]; tdbPut(kn, thumbCache[kn]).catch(()=>{}); } delete thumbCache[ko]; tdbPut(ko, null).catch(()=>{}); }\n    renderGallery();\n  }\n};\n\ntdbAll().then(t=>{ thumbCache=t; renderGallery(); }).catch(()=>{});\n\n\nrender();\nrenderMonthGrid();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
