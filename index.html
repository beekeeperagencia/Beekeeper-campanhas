lendarYear, monthIdx, 1);\n  const to = new Date(calendarYear, monthIdx+1, 0);\n  const iso = d => d.toISOString().slice(0,10);\n  filterFrom = iso(from); filterTo = iso(to);\n  document.getElementById('dateFrom').value = filterFrom;\n  document.getElementById('dateTo').value = filterTo;\n  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));\n  renderMonthGrid();\n  render();\n}\n\nfunction applyPreset(kind){\n  const today = new Date();\n  let from, to = today;\n  if(kind==='30d'){ from = new Date(today); from.setDate(from.getDate()-30); }\n  else if(kind==='month'){ from = new Date(today.getFullYear(), today.getMonth(), 1); }\n  else if(kind==='year'){ from = new Date(today.getFullYear(), 0, 1); }\n  const iso = d => d.toISOString().slice(0,10);\n  filterFrom = iso(from); filterTo = iso(to);\n  document.getElementById('dateFrom').value = filterFrom;\n  document.getElementById('dateTo').value = filterTo;\n  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('onclick').includes(\"'\"+kind+\"'\")));\n  activeMonthIdx = null; renderMonthGrid();\n  render();\n}\nfunction resetFilter(){\n  filterFrom = null; filterTo = null;\n  document.getElementById('dateFrom').value = '';\n  document.getElementById('dateTo').value = '';\n  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));\n  activeMonthIdx = null; renderMonthGrid();\n  render();\n}\n\nfunction openModal(type){\n  document.getElementById('modal'+capitalize(type)).classList.add('show');\n  if(type==='orcamento'){\n    // Seta data de hoje se vazio\n    const od = document.getElementById('o_date');\n    if(od && !od.value) od.value = new Date().toISOString().slice(0,10);\n    // Limpar campo criativo ao abrir modal\n    const ocr = document.getElementById('o_criativo');\n    if(ocr) ocr.value = '';\n  }\n}\nfunction closeModal(type){ document.getElementById('modal'+capitalize(type)).classList.remove('show'); }\nfunction capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }\n\ndocument.getElementById('formAnuncio').addEventListener('submit', function(e){\n  e.preventDefault();\n  const ds = document.getElementById('a_dateStart').value;\n  const de = document.getElementById('a_dateEnd').value || ds;\n  getCurrentClient().anuncios.push({\n    dateStart: ds, dateEnd: de,\n    campaign: document.getElementById('a_campaign').value,\n    name: document.getElementById('a_name').value,\n    leads: parseFloat(document.getElementById('a_leads').value)||0,\n    spend: parseFloat(document.getElementById('a_spend').value)||0,\n    impr: parseFloat(document.getElementById('a_impr').value)||0,\n    freq: document.getElementById('a_freq').value ? parseFloat(document.getElementById('a_freq').value) : null,\n    ctrAll: document.getElementById('a_ctrall').value ? parseFloat(document.getElementById('a_ctrall').value) : null,\n    ctrLink: document.getElementById('a_ctrlink').value ? parseFloat(document.getElementById('a_ctrlink').value) : null,\n    cpc: document.getElementById('a_cpc').value ? parseFloat(document.getElementById('a_cpc').value) : null,\n    reach: optNum('a_reach'), linkClicks: optNum('a_clicks'), views3s: optNum('a_v3'), thruplay: optNum('a_thru')\n  });\n  saveData(); render(); closeModal('anuncio'); this.reset();\n});\n\ndocument.getElementById('formOrcamento').addEventListener('submit', function(e){\n  e.preventDefault();\n  const client = getCurrentClient();\n  const proposalId = document.getElementById('o_proposalId').value.trim();\n  if(proposalId && client.orcamentos.some(o=>o.proposalId===proposalId)){\n    if(!confirm(`A proposta Nº ${proposalId} já existe no sistema. Adicionar mesmo assim?`)) return;\n  }\n  client.orcamentos.push({\n    name: document.getElementById('o_name').value,\n    vehicle: document.getElementById('o_vehicle').value,\n    year: parseInt(document.getElementById('o_year').value)||null,\n    type: document.getElementById('o_type').value,\n    value: parseFloat(document.getElementById('o_value').value)||0,\n    city: document.getElementById('o_city').value,\n    status: document.getElementById('o_status').value,\n    date: document.getElementById('o_date').value,\n    proposalId,\n    criativo: document.getElementById('o_criativo').value\n  });\n  saveData(); render(); closeModal('orcamento'); this.reset();\n});\n\nfunction deleteAnuncio(idx){\n  if(!confirm('Remover este registro?')) return;\n  getCurrentClient().anuncios.splice(idx,1); saveData(); render();\n}\nfunction deleteOrcamento(idx){\n  if(!confirm('Remover este orçamento?')) return;\n  getCurrentClient().orcamentos.splice(idx,1); saveData(); render();\n}\n\nfunction exportJSON(){\n  const client = getCurrentClient();\n  const blob = new Blob([JSON.stringify(client,null,2)], {type:'application/json'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = client.id + '_backup.json';\n  a.click(); URL.revokeObjectURL(url);\n}\nfunction importJSON(event){\n  const file = event.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = function(e){\n    try{\n      const imported = JSON.parse(e.target.result);\n      const full = imported && imported.data && Array.isArray(imported.data.clients) ? imported.data : (imported && Array.isArray(imported.clients) ? imported : null);\n      if(full){\n        if(!confirm('Restaurar o backup completo? Os clientes atuais serão substituídos pelos ' + full.clients.length + ' cliente(s) do arquivo.')) return;\n        DATA = full;\n        if(!DATA.clients.find(c=>c.id===DATA.currentClientId)) DATA.currentClientId = (DATA.clients[0]||{}).id;\n        if(imported.thumbs){ Object.keys(imported.thumbs).forEach(k=>{ thumbCache[k]=imported.thumbs[k]; tdbPut(k, imported.thumbs[k]).catch(()=>{}); }); }\n        saveData(); applyClientTheme(getCurrentClient()); render();\n        alert('Backup completo restaurado.');\n        return;\n      }\n      if(imported.anuncios && imported.orcamentos){\n        let client = imported.id ? DATA.clients.find(c=>c.id===imported.id) : null;\n        if(imported.id && !client){\n          client = JSON.parse(JSON.stringify(imported)); DATA.clients.push(client); DATA.currentClientId = client.id;\n          saveData(); applyClientTheme(client); render();\n          alert('Cliente ' + client.name + ' adicionado a partir do backup.');\n          return;\n        }\n        if(client) DATA.currentClientId = client.id; else client = getCurrentClient();\n        client.anuncios = imported.anuncios;\n        client.orcamentos = imported.orcamentos;\n        if(imported.name) client.name = imported.name;\n        if(imported.subtitle) client.subtitle = imported.subtitle;\n        saveData(); applyClientTheme(client); render();\n        alert('Dados importados com sucesso para ' + client.name + '.');\n      } else { alert('Arquivo inválido.'); }\n    }catch(err){ alert('Erro ao ler arquivo: '+err.message); }\n  };\n  reader.readAsText(file);\n  event.target.value = '';\n}\n\nfunction parseCSVLine(line){\n  const out = []; let cur = ''; let inQuotes = false;\n  for(let i=0;i<line.length;i++){\n    const ch = line[i];\n    if(ch === '\"'){\n      if(inQuotes && line[i+1] === '\"'){ cur += '\"'; i++; }\n      else { inQuotes = !inQuotes; }\n    } else if(ch === ',' && !inQuotes){\n      out.push(cur); cur = '';\n    } else { cur += ch; }\n  }\n  out.push(cur);\n  return out;\n}\nfunction parseNum(v){\n  if(v==null) return null;\n  v = String(v).trim().replace(/^\"|\"$/g,'');\n  if(v==='' || v==='–' || v==='-' || v==='—') return null;\n  v = v.replace(/\\./g,'').replace(',', '.');\n  const n = parseFloat(v);\n  return isNaN(n) ? null : n;\n}\n// Meta's own CSV exports use standard English decimal notation (e.g. \"652.88\", \"18.135556\") — no thousands separator.\n// Do NOT reuse the Brazilian-format parser above for these columns, or values get inflated ~100x.\nfunction parseNumMeta(v){\n  if(v==null) return null;\n  v = String(v).trim().replace(/^\"|\"$/g,'');\n  if(v==='' || v==='–' || v==='-' || v==='—') return null;\n  const n = parseFloat(v);\n  return isNaN(n) ? null : n;\n}\nfunction importMetaCSV(event){\n  const file = event.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = function(e){\n    try{\n      const text = e.target.result;\n      const lines = text.split(/\\r?\\n/).filter(l=>l.trim().length>0);\n      if(lines.length < 2){ alert('Arquivo vazio ou sem dados.'); return; }\n      const headers = parseCSVLine(lines[0]).map(h=>h.trim());\n      const idx = {}; headers.forEach((h,i)=>{ idx[h] = i; });\n      const col = (row, ...names) => { for(const n of names){ if(idx[n]!=null && row[idx[n]]!=null) return row[idx[n]]; } return null; };\n      const colRe = (row, re) => { const hd = headers.find(x=>re.test(x) && !/custo|cost|taxa|\\(BRL\\)/i.test(x)); return hd!=null ? row[idx[hd]] : null; };\n\n      const client = getCurrentClient();\n\n      // First pass: validate and collect rows without touching existing data yet\n      const parsedRows = [];\n      let skipped = 0;\n      for(let i=1;i<lines.length;i++){\n        const row = parseCSVLine(lines[i]);\n        const name = col(row,'Nome do anúncio');\n        if(!name){ skipped++; continue; }\n        const dateStart = col(row,'Início dos relatórios');\n        const dateEnd = col(row,'Encerramento dos relatórios');\n        const spend = parseNumMeta(col(row,'Valor gasto (BRL)')) || 0;\n        const leads = parseNumMeta(col(row,'Resultados')) || 0;\n        const impr = parseNumMeta(col(row,'Impressões')) || 0;\n        const freq = parseNumMeta(col(row,'Frequência'));\n        const ctrAll = parseNumMeta(col(row,'CTR (todos)'));\n        const ctrLink = parseNumMeta(col(row,'CTR (taxa de cliques no link)'));\n        const cpc = parseNumMeta(col(row,'CPC (todos) (BRL)'));\n        const isImage = /\\b(arte|imagem)\\b/i.test(name);\n        const campaign = isImage ? 'imagem' : 'video';\n        parsedRows.push({\n          dateStart: dateStart || new Date().toISOString().slice(0,10),\n          dateEnd: dateEnd || dateStart || new Date().toISOString().slice(0,10),\n          campaign, name: name.trim(), leads, spend, impr, freq, ctrAll, ctrLink, cpc,\n          reach: parseNumMeta(colRe(row, /^alcance$/i)),\n          linkClicks: parseNumMeta(colRe(row, /^cliques no link$/i)),\n          views3s: parseNumMeta(colRe(row, /(reprodu|visualiza).*3\\s*segundos/i)),\n          thruplay: parseNumMeta(colRe(row, /thruplay/i)),\n          p25: parseNumMeta(colRe(row, /reprodu.*\\b25\\s*%/i)), p50: parseNumMeta(colRe(row, /reprodu.*\\b50\\s*%/i)),\n          p75: parseNumMeta(colRe(row, /reprodu.*\\b75\\s*%/i)), p100: parseNumMeta(colRe(row, /reprodu.*\\b100\\s*%/i))\n        });\n      }\n\n      if(parsedRows.length===0){\n        alert(`Nenhum anúncio válido encontrado neste arquivo.\\n${skipped} linhas sem nome de anúncio, ignoradas — confirme se exportou o relatório no nível \"Anúncios\", não \"Campanhas\".\\n\\nOs dados anteriores NÃO foram alterados.`);\n        return;\n      }\n\n      let msg;\n      if(filterFrom || filterTo){\n        // Scoped replace: only wipe existing entries that fall within the currently selected period,\n        // preserving data from other months/periods already imported.\n        const before = client.anuncios.length;\n        client.anuncios = client.anuncios.filter(a=>{\n          const s = new Date(a.dateStart), e = new Date(a.dateEnd||a.dateStart);\n          const inSelected = (!filterTo || s <= new Date(filterTo)) && (!filterFrom || e >= new Date(filterFrom));\n          return !inSelected;\n        });\n        const removed = before - client.anuncios.length;\n        client.anuncios = client.anuncios.concat(parsedRows);\n        msg = `Importação concluída: ${parsedRows.length} anúncios carregados para o período selecionado (${filterFrom||'início'} a ${filterTo||'hoje'}).\\n${removed} registro(s) antigos desse mesmo período foram substituídos. Dados de outros períodos foram preservados.`;\n      } else {\n        // No period selected: full replace, as the imported file is treated as the complete authoritative snapshot.\n        const previousCount = client.anuncios.length;\n        client.anuncios = parsedRows;\n        msg = `Substituição concluída: ${parsedRows.length} anúncios carregados a partir deste arquivo.\\n(${previousCount} registro(s) anterior(es) foram substituídos por este novo total — nenhum período estava selecionado no filtro.)`;\n      }\n      saveData(); render();\n      if(skipped) msg += `\\n${skipped} linhas sem nome de anúncio, ignoradas.`;\n      alert(msg);\n    }catch(err){ alert('Erro ao processar o CSV: '+err.message); }\n  };\n  reader.readAsText(file, 'UTF-8');\n  event.target.value = '';\n}\n\nif(typeof pdfjsLib !== 'undefined'){\n  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n}\n\nconst MOTO_HINTS = ['nmax','cg 1','cg150','cg 150','titan','fan flex','factor','mt-0','mt0','biz','pop 1','xre','bros','fazer','cb ','twister','crypton','lander','cbr','ybr','dafra','shineray'];\nconst CAMINHAO_HINTS = ['caminhão','caminhao','scania','volvo fh','volvo vm','mb actros','mercedes actros','ford cargo','iveco','daf xf','man tgx','man tgm','volkswagen constellation','vw constellation','randon','mb 17','mb 24','mb 26','freightliner','kenworth','peterbilt','internacional','axor','atego','accelo','vw 17','vw 24','vw 26','worker','constellation','delivery','agrale'];\n\nfunction guessType(vehicleText){\n  const v = (vehicleText||'').toLowerCase();\n  if(CAMINHAO_HINTS.some(h=>v.includes(h))) return 'Caminhão';\n  if(MOTO_HINTS.some(h=>v.includes(h))) return 'Moto';\n  return 'Carro';\n}\n\nfunction extractField(text, labelPatterns, stopPatterns){\n  for(const label of labelPatterns){\n    const re = new RegExp(label + '\\\\s*:?\\\\s*([^\\\\n]*?)(?=\\\\s*(?:' + stopPatterns.join('|') + ')|$)', 'i');\n    const m = text.match(re);\n    if(m && m[1] && m[1].trim()) return m[1].trim();\n  }\n  return '';\n}\n\nfunction extractProposalId(filename, pdfText){\n  const fromName = filename.match(/(\\d{4,8})/);\n  if(fromName) return fromName[1];\n  // 9Eixos: \"COTAÇÃO: 45025516\"\n  const fromCotacao = pdfText.match(/COTA[ÇC][ÃA]O\\s*:?\\s*(\\d{5,9})/i);\n  if(fromCotacao) return fromCotacao[1];\n  const fromText = pdfText.match(/(?:proposta|orçamento)\\s*[:\\-#nº°]*\\s*(\\d{4,7})/i);\n  if(fromText) return fromText[1];\n  return '';\n}\n\nfunction detectPdfFormat(flat){\n  if(/COTA[ÇC][ÃA]O\\s*:/i.test(flat) || /9\\s*eixos/i.test(flat) || /eixos\\s*brasil/i.test(flat)) return '9eixos';\n  return 'agsmb';\n}\n\nfunction parse9EixosProposalText(text, filename){\n  const flat = text.replace(/\\s+/g,' ').trim();\n  const proposalId = extractProposalId(filename||'', flat);\n\n  // Data\n  let date = new Date().toISOString().slice(0,10);\n  const dMatch = flat.match(/Data\\s*:?\\s*(\\d{2})\\/(\\d{2})\\/(\\d{4})/i);\n  if(dMatch) date = dMatch[3]+'-'+dMatch[2]+'-'+dMatch[1];\n\n  // Validade\n  let validade = '';\n  const vMatch = flat.match(/Validade\\s*:?\\s*(\\d+\\s*dias?)/i);\n  if(vMatch) validade = vMatch[1];\n\n  // Nome: campo \"Olá João Henrique\" logo após a logo na 9Eixos\n  // Nome após \"Olá\": pega palavras capitalizadas até stopword ou início minúsculo\n  let name = '';\n  const _olaIdx = flat.search(/Ol[aá]\\s/i);\n  if(_olaIdx>=0){\n    const _aft = flat.slice(_olaIdx).replace(/^Ol[aá]\\s+/i,'');\n    const _sw = ['Esta','Aqui','Para','Seu','Sua','Segue','Confira','Prezado','Prezada','Uma','Um','Isso'];\n    const _ps = [];\n    for(const _w of _aft.split(/\\s+/).slice(0,6)){\n      if(!_w||_sw.indexOf(_w)>=0||/^[a-z]/.test(_w)||!/^[A-ZÀ-Ú]/.test(_w)) break;\n      _ps.push(_w);\n    }\n    name = _ps.join(' ');\n  }\n  // fallback: campo \"Nome:\" ou \"Cliente:\"\n  if(!name) name = extractField(flat, ['Nome','Cliente'], ['CPF','CNPJ','Telefone','Veículo','Modelo','Placa','DADOS','Filiação']);\n\n  // Veículo / Modelo\n  const vehicle = extractField(flat, ['Veículo','Modelo do veículo','Modelo','Descrição'], ['Ano','Placa','Valor','PLAN','TOTAL','Filiação']);\n\n  // Ano\n  let year = null;\n  const yrRaw = extractField(flat, ['Ano'], ['Valor','Placa','PLAN','Mensalidade','TOTAL']);\n  const yMatch = (yrRaw||'').match(/(19|20)\\d{2}/);\n  if(yMatch) year = parseInt(yMatch[0]);\n  if(!year){ const ym2 = flat.match(/\\b(20\\d{2})\\b/); if(ym2) year = parseInt(ym2[1]); }\n\n  // Mensalidade: pega APENAS o valor da seção TOTAL (último \"Contribuição Mensal\" no PDF)\n  // O PDF tem: \"COTAÇÃO DO AGREGADO > Contribuição Mensal: R$300\" E \"TOTAL > Contribuição Mensal: R$885\"\n  // Queremos sempre o valor da seção TOTAL\n  let value = 0;\n  // Estratégia: pegar o trecho do texto a partir de \"TOTAL\" e buscar Contribuição Mensal ali\n  const totalIdx = flat.search(/\\bTOTAL\\b/i);\n  const searchIn = totalIdx >= 0 ? flat.slice(totalIdx) : flat;\n  const contribMatch = searchIn.match(/Contribui[çc][ãa]o\\s*[Mm]ensal\\s*:?\\s*R?\\$?\\s*([\\d\\s.,]+)/i);\n  if(contribMatch){ value = parseNum(contribMatch[1]) || 0; }\n  if(!value){\n    // fallback: último match de Contribuição Mensal no texto inteiro\n    const allMatches = [...flat.matchAll(/Contribui[çc][ãa]o\\s*[Mm]ensal\\s*:?\\s*R?\\$?\\s*([\\d\\s.,]+)/gi)];\n    if(allMatches.length > 0){ value = parseNum(allMatches[allMatches.length-1][1]) || 0; }\n  }\n  if(!value){\n    // fallback AGSMB\n    const mm = flat.match(/VALOR\\s*M[ÉE]DIO\\s*MENSALIDADE[^R]*R\\$\\s*([\\d.,]+)/i);\n    if(mm) value = parseNum(mm[1]) || 0;\n  }\n\n  const type = guessType(vehicle);\n\n  return {\n    name: name||'(nome não identificado)',\n    vehicle: vehicle||'(veículo não identificado)',\n    year, value, type,\n    city:'', status:'Pendente', date,\n    proposalId, validade,\n    _source:'9eixos',\n    _warn:(!name||!vehicle||!value)?'Alguns campos podem estar incompletos — confira antes de confirmar.':null\n  };\n}\n\nfunction parseAgsmbProposalText(text, filename){\n  const flat = text.replace(/\\s+/g,' ').trim();\n  const name = extractField(flat, ['Nome'], ['Modelo','Telefone']);\n  const vehicle = extractField(flat, ['Modelo'], ['Telefone','Placa']);\n  const yearRaw = extractField(flat, ['Ano Modelo','Ano'], ['Valor Protegido','ASSIST']);\n  const dateRaw = extractField(flat, ['Data da Proposta'], ['Proposta válida','DADOS']);\n  const proposalId = extractProposalId(filename||'', flat);\n\n  // mensalidade: look for \"VALOR MÉDIO MENSALIDADE\" followed eventually by an R$ amount\n  let value = 0;\n  const mensMatch = flat.match(/VALOR M[ÉE]DIO MENSALIDADE[^R]*R\\$\\s*([\\d.,]+)/i);\n  if(mensMatch) value = parseNum(mensMatch[1]) || 0;\n\n  let year = null;\n  const yMatch = (yearRaw||'').match(/(19|20)\\d{2}/);\n  if(yMatch) year = parseInt(yMatch[0]);\n\n  let date = new Date().toISOString().slice(0,10);\n  const dMatch = (dateRaw||'').match(/(\\d{2})\\/(\\d{2})\\/(\\d{4})/);\n  if(dMatch) date = `${dMatch[3]}-${dMatch[2]}-${dMatch[1]}`;\n\n  return {\n    name: name || '(nome não identificado)',\n    vehicle: vehicle || '(veículo não identificado)',\n    year, value,\n    type: guessType(vehicle),\n    city: '', status: 'Pendente', date,\n    proposalId,\n    _warn: (!name || !vehicle || !value) ? 'Alguns campos podem estar incompletos — confira antes de confirmar.' : null\n  };\n}\n\nlet pdfReviewRows = [];\n\nasync function handlePdfFiles(event){\n  const files = Array.from(event.target.files || []);\n  if(files.length===0) return;\n  if(typeof pdfjsLib === 'undefined'){ alert('Não foi possível carregar o leitor de PDF. Verifique sua conexão com a internet e tente novamente.'); return; }\n\n  pdfReviewRows = [];\n  const content = document.getElementById('pdfReviewContent');\n  content.innerHTML = '<div class=\"pdf-loading\">Lendo ' + files.length + ' arquivo(s)...<\u002Fdiv>';\n  openModal('pdfReview');\n\n  for(const file of files){\n    try{\n      const buf = await file.arrayBuffer();\n      const pdf = await pdfjsLib.getDocument({data: buf}).promise;\n      let fullText = '';\n      for(let p=1; p<=pdf.numPages; p++){\n        const page = await pdf.getPage(p);\n        const tc = await page.getTextContent();\n        fullText += tc.items.map(it=>it.str).join(' ') + '\\n';\n      }\n      const _flat = fullText.replace(/\\s+/g,' ').trim();\n      const _fmt = detectPdfFormat(_flat);\n      const _parsed = _fmt==='9eixos' ? parse9EixosProposalText(fullText, file.name) : parseAgsmbProposalText(fullText, file.name);\n      pdfReviewRows.push(_parsed);\n    }catch(err){\n      pdfReviewRows.push({name:'(erro ao ler '+file.name+')', vehicle:'', year:null, value:0, type:'Carro', city:'', status:'Pendente', date:new Date().toISOString().slice(0,10), _warn:'Falha ao processar este arquivo: '+err.message});\n    }\n  }\n  renderPdfReview();\n  event.target.value = '';\n}\n\nfunction renderPdfReview(){\n  const content = document.getElementById('pdfReviewContent');\n  if(pdfReviewRows.length===0){ content.innerHTML = '<div class=\"empty-note\">Nenhum orçamento extraído.<\u002Fdiv>'; return; }\n  const existingIds = new Set(getCurrentClient().orcamentos.map(o=>o.proposalId).filter(Boolean));\n  // Criativos disponíveis no sistema (dos anúncios cadastrados via CSV)\n  const criativos = [...new Set(getCurrentClient().anuncios.map(a=>a.name).filter(Boolean))].sort();\n  content.innerHTML = `<table class=\"review-table\">\n    <thead><tr><th>Nº Proposta<\u002Fth><th>Nome<\u002Fth><th>Veículo<\u002Fth><th>Ano<\u002Fth><th>Tipo<\u002Fth><th>Mensalidade<\u002Fth><th>Data<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>${pdfReviewRows.map((r,i)=>{\n      const isDup = r.proposalId && existingIds.has(r.proposalId);\n      const crOpts = criativos.map(n=>`<option value=\"${esc(n)}\" ${r.criativo===n?'selected':''}>${esc(n)}<\u002Foption>`).join('');\n      const hasCriativos = criativos.length > 0;\n      return `\n      <tr>\n        <td><input value=\"${esc(r.proposalId)}\" style=\"width:90px;${isDup?'border-color:var(--red);color:var(--red);':''}\" onchange=\"pdfReviewRows[${i}].proposalId=this.value\"><\u002Ftd>\n        <td><input value=\"${esc(r.name)}\" onchange=\"pdfReviewRows[${i}].name=this.value\"><\u002Ftd>\n        <td><input value=\"${esc(r.vehicle)}\" onchange=\"pdfReviewRows[${i}].vehicle=this.value\"><\u002Ftd>\n        <td><input type=\"number\" value=\"${r.year||''}\" style=\"width:70px\" onchange=\"pdfReviewRows[${i}].year=parseInt(this.value)||null\"><\u002Ftd>\n        <td><select onchange=\"pdfReviewRows[${i}].type=this.value\"><option ${r.type==='Carro'?'selected':''}>Carro<\u002Foption><option ${r.type==='Moto'?'selected':''}>Moto<\u002Foption><option ${r.type==='Caminhão'?'selected':''}>Caminhão<\u002Foption><option ${r.type==='Outro'?'selected':''}>Outro<\u002Foption><\u002Fselect><\u002Ftd>\n        <td><input type=\"number\" step=\"0.01\" value=\"${r.value}\" style=\"width:80px\" onchange=\"pdfReviewRows[${i}].value=parseFloat(this.value)||0\"><\u002Ftd>\n        <td><input type=\"date\" value=\"${r.date}\" onchange=\"pdfReviewRows[${i}].date=this.value\"><\u002Ftd>\n        <td><span class=\"review-remove\" onclick=\"removePdfReviewRow(${i})\">✕<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr><td colspan=\"8\" style=\"padding:4px 0 10px 0;\">\n        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n          <span style=\"font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;\">🎯 Criativo de origem<\u002Fspan>\n          ${hasCriativos\n            ? `<div style=\"position:relative;flex:1;min-width:180px;\">\n                <input id=\"cr_inp_${i}\" value=\"${esc(r.criativo||'')}\" placeholder=\"Selecione ou digite o criativo...\" autocomplete=\"off\"\n                  style=\"width:100%;font-size:12px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);\"\n                  oninput=\"pdfReviewRows[${i}].criativo=this.value;filtrarCriativoPdf('cr_inp_${i}','cr_list_${i}',this.value)\"\n                  onfocus=\"filtrarCriativoPdf('cr_inp_${i}','cr_list_${i}',this.value)\"\n                  onblur=\"setTimeout(()=>{const l=document.getElementById('cr_list_${i}');if(l)l.style.display='none'},200)\">\n                <div id=\"cr_list_${i}\" style=\"display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;z-index:9999;max-height:160px;overflow-y:auto;box-shadow:0 8px 24px #000a;margin-top:2px;\"><\u002Fdiv>\n               <\u002Fdiv>`\n            : `<span style=\"font-size:12px;color:var(--muted-2);\">Importe um CSV do Meta Ads primeiro para ver os criativos disponíveis.<\u002Fspan>`\n          }\n        <\u002Fdiv>\n      <\u002Ftd><\u002Ftr>\n      ${isDup?`<tr><td colspan=\"8\" style=\"padding-top:0;\"><span class=\"review-warn\" style=\"color:var(--red);\">⚠ Proposta Nº ${esc(r.proposalId)} já existe no sistema — remova esta linha (✕) para não duplicar, a menos que seja um reorçamento intencional com número diferente.<\u002Fspan><\u002Ftd><\u002Ftr>`:''}\n      ${r._warn?`<tr><td colspan=\"8\" style=\"padding-top:0;\"><span class=\"review-warn\">⚠ ${esc(r._warn)}<\u002Fspan><\u002Ftd><\u002Ftr>`:''}\n      ${r.validade?`<tr><td colspan=\"8\" style=\"padding-top:0;font-size:11px;color:var(--muted-2);\">📅 Validade: <strong>${esc(r.validade)}<\u002Fstrong><\u002Ftd><\u002Ftr>`:''}\n      ${r._source==='9eixos'?`<tr><td colspan=\"8\" style=\"padding-top:0;font-size:11px;color:var(--muted-2);\">📄 <strong>9 Eixos Brasil<\u002Fstrong> — Contribuição Mensal extraída do campo TOTAL<\u002Ftd><\u002Ftr>`:''}\n    `;}).join('')}<\u002Ftbody>\n  <\u002Ftable>`;\n}\n\nfunction filtrarCriativoPdf(inpId, listId, query){\n  const list = document.getElementById(listId);\n  if(!list) return;\n  const criativos = [...new Set(getCurrentClient().anuncios.map(a=>a.name).filter(Boolean))].sort();\n  const q = (query||'').toLowerCase();\n  const matches = q ? criativos.filter(n=>n.toLowerCase().includes(q)) : criativos;\n  if(!matches.length){ list.style.display='none'; return; }\n  list.innerHTML = matches.map(n=>{\n    const safe = n.replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\");\n    return '<div onmousedown=\"document.getElementById(\\''+inpId+'\\').value=\\''+safe+'\\';\\\nvar idx=parseInt(\\''+inpId+'\\'.replace(\\'cr_inp_\\',\\'\\'));pdfReviewRows[idx].criativo=\\''+safe+'\\';\\\ndocument.getElementById(\\''+listId+'\\').style.display=\\'none\\';\" \\\nstyle=\"padding:9px 14px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);\" \\\nonmouseover=\"this.style.background=\\'var(--bg)\\'\" onmouseout=\"this.style.background=\\'\\'\">'+n+'<\u002Fdiv>';\n  }).join('');\n  list.style.display = 'block';\n}\nfunction removePdfReviewRow(i){\n  pdfReviewRows.splice(i,1);\n  renderPdfReview();\n}\nfunction confirmPdfImport(){\n  const client = getCurrentClient();\n  const existingIds = new Set(client.orcamentos.map(o=>o.proposalId).filter(Boolean));\n  let added = 0, blocked = 0;\n  pdfReviewRows.forEach(r=>{\n    if(r.proposalId && existingIds.has(r.proposalId)){ blocked++; return; }\n    client.orcamentos.push({\n      name:r.name, vehicle:r.vehicle, year:r.year, type:r.type, value:r.value, city:r.city||'', status:r.status||'Pendente', date:r.date, proposalId:r.proposalId||'', criativo:r.criativo||''\n    });\n    if(r.proposalId) existingIds.add(r.proposalId);\n    added++;\n  });\n  pdfReviewRows = [];\n  saveData(); render(); closeModal('pdfReview');\n  let msg = `${added} orçamentos importados.`;\n  if(blocked) msg += `\\n${blocked} bloqueados por número de proposta já existente no sistema.`;\n  alert(msg);\n}\n\nfunction clearOrcamentos(){\n  const client = getCurrentClient();\n  if(filterFrom || filterTo){\n    const toRemove = client.orcamentos.filter(o=>inRange(o.date));\n    const count = toRemove.length;\n    if(count===0){ alert('Nenhum orçamento no período selecionado.'); return; }\n    if(!confirm(`Isso vai apagar ${count} orçamento(s) do período selecionado (${filterFrom||'início'} a ${filterTo||'hoje'}) de \"${client.name}\". Os demais períodos NÃO serão afetados. Continuar?`)) return;\n    if(!confirm('Confirma mesmo? Última chance — exporte um backup antes se tiver dúvida.')) return;\n    client.orcamentos = client.orcamentos.filter(o=>!inRange(o.date));\n    saveData(); render();\n    alert(`${count} orçamento(s) do período selecionado foram zerados. Outros períodos preservados.`);\n  } else {\n    const count = client.orcamentos.length;\n    if(count===0){ alert('Já está vazio.'); return; }\n    if(!confirm(`Nenhum período está selecionado — isso vai apagar TODOS os ${count} orçamentos de \"${client.name}\". Essa ação não pode ser desfeita. Continuar?`)) return;\n    if(!confirm('Confirma mesmo? Última chance — exporte um backup antes se tiver dúvida.')) return;\n    client.orcamentos = [];\n    saveData(); render();\n    alert('Todos os orçamentos foram zerados. Pronto para nova conferência.');\n  }\n}\n\nfunction openRenameModal(){\n  const client = getCurrentClient();\n  const names = [...new Set(client.anuncios.map(a=>a.name))].sort();\n  const sel = document.getElementById('rn_old');\n  if(names.length===0){ alert('Nenhum criativo cadastrado ainda.'); return; }\n  sel.innerHTML = names.map(n=>`<option value=\"${esc(n)}\">${esc(n)}<\u002Foption>`).join('');\n  document.getElementById('rn_new').value = '';\n  openModal('rename');\n}\nfunction confirmRename(){\n  const oldName = document.getElementById('rn_old').value;\n  const newName = document.getElementById('rn_new').value.trim();\n  if(!newName){ alert('Digite o novo nome.'); return; }\n  const client = getCurrentClient();\n  let count = 0;\n  client.anuncios.forEach(a=>{ if(a.name===oldName){ a.name = newName; count++; } });\n  saveData(); render(); closeModal('rename');\n  alert(`${count} registro(s) atualizado(s) para \"${newName}\".`);\n}\n\nfunction processBulkOrc(){\n  const text = document.getElementById('bulkText').value.trim();\n  if(!text){ alert('Cole os dados primeiro.'); return; }\n  const lines = text.split(/\\r?\\n/).filter(l=>l.trim().length>0);\n  if(lines.length < 2){ alert('Inclua ao menos uma linha de cabeçalho e uma linha de dados.'); return; }\n  const delim = lines[0].includes('\\t') ? '\\t' : ',';\n  const splitLine = (line) => delim==='\\t' ? line.split('\\t') : parseCSVLine(line);\n  const headers = splitLine(lines[0]).map(h=>h.trim().toLowerCase());\n  const findCol = (...names) => {\n    for(const n of names){ const i = headers.indexOf(n.toLowerCase()); if(i>=0) return i; }\n    return -1;\n  };\n  const iName = findCol('nome');\n  const iVehicle = findCol('descrição','descricao','veículo','veiculo','item');\n  const iYear = findCol('ano','ano/ref.','ano/ref');\n  const iType = findCol('tipo');\n  const iValue = findCol('valor mensal','valor','mensalidade');\n  const iCity = findCol('cidade');\n  const iStatus = findCol('status');\n  const iDate = findCol('data');\n\n  if(iName<0 || iValue<0){ alert('É preciso ao menos as colunas \"Nome\" e \"Valor mensal\".'); return; }\n\n  const client = getCurrentClient();\n  let added = 0;\n  for(let i=1;i<lines.length;i++){\n    const row = splitLine(lines[i]);\n    const name = (row[iName]||'').trim();\n    if(!name) continue;\n    client.orcamentos.push({\n      name,\n      vehicle: iVehicle>=0 ? (row[iVehicle]||'').trim() : '',\n      year: iYear>=0 ? (parseInt(row[iYear])||null) : null,\n      type: iType>=0 ? (row[iType]||'Carro').trim() : 'Carro',\n      value: parseNum(row[iValue]) || 0,\n      city: iCity>=0 ? (row[iCity]||'').trim() : '',\n      status: iStatus>=0 && row[iStatus] ? row[iStatus].trim() : 'Pendente',\n      date: iDate>=0 && row[iDate] ? row[iDate].trim() : new Date().toISOString().slice(0,10)\n    });\n    added++;\n  }\n  saveData(); render(); closeModal('bulkOrc');\n  document.getElementById('bulkText').value = '';\n  alert(`${added} orçamentos importados.`);\n}\n\nfunction sortRows(rows, col, dir){\n  return rows.slice().sort((a,b)=>{\n    let va = a[col], vb = b[col];\n    if(va==null) va = -Infinity; if(vb==null) vb = -Infinity;\n    if(typeof va === 'string'){ va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }\n    if(va < vb) return dir==='asc' ? -1 : 1;\n    if(va > vb) return dir==='asc' ? 1 : -1;\n    return 0;\n  });\n}\n\nfunction fatigueOf(recs){\n  const r = recs.slice().sort((a,b)=>String(a.dateStart).localeCompare(String(b.dateStart)));\n  const last = r[r.length-1];\n  if(last && last.freq!=null && last.freq>=2.5) return 'Frequência de '+fmtNum(last.freq)+' no último período: o público já viu este anúncio muitas vezes';\n  const c = r.filter(x=>x.ctrLink!=null && (x.impr||0)>=300);\n  if(c.length>=2){\n    const a = c[0].ctrLink, b = c[c.length-1].ctrLink;\n    if(a>0 && b<a*0.7) return 'CTR (link) caiu '+Math.round((1-b/a)*100)+'% desde o primeiro período ('+fmtPct(a)+' para '+fmtPct(b)+')';\n  }\n  return null;\n}\n\nfunction aggregateCreatives(anuncios){\n  const map = {};\n  anuncios.forEach(a=>{\n    if(!map[a.name]) map[a.name] = {name:a.name, campaign:a.campaign, leads:0, spend:0, impr:0, reach:0, reachN:0, clicks:0, clicksN:0, v3:0, v3N:0, thru:0, thruN:0, p:[0,0,0,0], pN:0, freqSum:0, freqW:0, ctrAllSum:0, ctrAllW:0, ctrLinkSum:0, ctrLinkW:0, cpcSum:0, cpcW:0, recs:[]};\n    const m = map[a.name];\n    m.leads += a.leads||0; m.spend += a.spend||0; m.impr += a.impr||0;\n    if(a.reach!=null){ m.reach += a.reach; m.reachN++; }\n    if(a.linkClicks!=null){ m.clicks += a.linkClicks; m.clicksN++; }\n    if(a.views3s!=null){ m.v3 += a.views3s; m.v3N++; }\n    if(a.thruplay!=null){ m.thru += a.thruplay; m.thruN++; }\n    if(a.p25!=null){ m.p[0]+=a.p25||0; m.p[1]+=a.p50||0; m.p[2]+=a.p75||0; m.p[3]+=a.p100||0; m.pN++; }\n    if(a.freq!=null){ m.freqSum += a.freq*a.spend; m.freqW += a.spend; }\n    if(a.ctrAll!=null){ m.ctrAllSum += a.ctrAll*a.spend; m.ctrAllW += a.spend; }\n    if(a.ctrLink!=null){ m.ctrLinkSum += a.ctrLink*a.spend; m.ctrLinkW += a.spend; }\n    if(a.cpc!=null){ m.cpcSum += a.cpc*a.spend; m.cpcW += a.spend; }\n    m.recs.push(a);\n  });\n  return Object.values(map).map(m=>({\n    name:m.name, campaign:m.campaign, leads:m.leads, spend:m.spend, impr:m.impr,\n    reach: m.reachN ? m.reach : null,\n    clicks: m.clicksN ? m.clicks : null,\n    views3s: m.v3N ? m.v3 : null,\n    thruplay: m.thruN ? m.thru : null,\n    cpl: m.leads>0 ? m.spend/m.leads : null,\n    freq: m.freqW>0 ? m.freqSum/m.freqW : (m.reachN && m.reach ? m.impr/m.reach : null),\n    ctrAll: m.ctrAllW>0 ? m.ctrAllSum/m.ctrAllW : null,\n    ctrLink: m.ctrLinkW>0 ? m.ctrLinkSum/m.ctrLinkW : (m.clicksN && m.impr ? m.clicks/m.impr*100 : null),\n    cpc: m.cpcW>0 ? m.cpcSum/m.cpcW : (m.clicksN && m.clicks ? m.spend/m.clicks : null),\n    cpm: m.impr>0 ? m.spend/m.impr*1000 : null,\n    hook: m.v3N && m.impr ? m.v3/m.impr*100 : null,\n    hold: m.thruN && m.v3 ? m.thru/m.v3*100 : null,\n    ret: m.pN && m.v3 ? m.p.map(x=>x/m.v3*100) : null,\n    fatigue: fatigueOf(m.recs)\n  }));\n}\n\nconst CREATIVE_COLS = [\n  {key:'name', label:'Criativo', tip:'Nome do anúncio testado'},\n  {key:'leads', label:'Leads', tip:'Conversas iniciadas no WhatsApp'},\n  {key:'spend', label:'Gasto', tip:'Valor investido nesse criativo'},\n  {key:'cpl', label:'CPL', tip:'Custo por lead: gasto dividido pelos leads'},\n  {key:'impr', label:'Impressões', tip:'Vezes que o anúncio apareceu'},\n  {key:'reach', label:'Alcance', tip:'Pessoas alcançadas (soma dos períodos importados)'},\n  {key:'cpm', label:'CPM', tip:'Custo por mil impressões'},\n  {key:'freq', label:'Frequência', tip:'Quantas vezes, em média, a mesma pessoa viu o anúncio'},\n  {key:'ctrAll', label:'CTR (todos)', tip:'% de quem viu e interagiu de alguma forma'},\n  {key:'ctrLink', label:'CTR (link)', tip:'% de quem clicou no botão de WhatsApp'},\n  {key:'cpc', label:'CPC', tip:'Custo médio por clique'},\n  {key:'hook', label:'Hook', tip:'% das impressões que assistiram 3 segundos do vídeo'},\n  {key:'hold', label:'Hold', tip:'% dos que assistiram 3s e chegaram ao ThruPlay'}\n];\n\nfunction renderCreativeTable(rows){\n  const head = document.getElementById('creativeHead');\n  head.innerHTML = CREATIVE_COLS.map(c=>{\n    const ind = sortCreative.col===c.key ? (sortCreative.dir==='asc'?'▲':'▼') : '';\n    return `<th title=\"${c.tip}\" onclick=\"toggleSortCreative('${c.key}')\">${c.label} <span class=\"arrow-ind\">${ind}<\u002Fspan><\u002Fth>`;\n  }).join('');\n  const sorted = sortRows(rows, sortCreative.col, sortCreative.dir);\n  const body = document.getElementById('creativeBody');\n  if(sorted.length===0){ body.innerHTML = '<tr><td colspan=\"13\" class=\"empty-note\">Nenhum dado no período selecionado<\u002Ftd><\u002Ftr>'; return; }\n  const meta = +getCurrentClient().cplMeta || 0;\n  body.innerHTML = sorted.map(r=>`\n    <tr>\n      <td class=\"name-cell\">${r.name}${r.fatigue?'<span class=\"flag new\" title=\"'+esc(r.fatigue)+'\">fadiga<\u002Fspan>':''}<\u002Ftd>\n      <td class=\"num\">${r.leads}<\u002Ftd>\n      <td class=\"num\">${fmtBRL(r.spend)}<\u002Ftd>\n      <td class=\"num ${meta&&r.cpl!=null?(r.cpl<=meta?'good':'bad'):''}\">${r.cpl!=null?fmtBRL(r.cpl):'—'}<\u002Ftd>\n      <td class=\"num\">${fmtInt(r.impr)}<\u002Ftd>\n      <td class=\"num\">${fmtInt(r.reach)}<\u002Ftd>\n      <td class=\"num\">${r.cpm!=null?fmtBRL(r.cpm):'—'}<\u002Ftd>\n      <td class=\"num\">${fmtNum(r.freq)}<\u002Ftd>\n      <td class=\"num\">${fmtPct(r.ctrAll)}<\u002Ftd>\n      <td class=\"num\">${fmtPct(r.ctrLink)}<\u002Ftd>\n      <td class=\"num\">${r.cpc!=null?fmtBRL(r.cpc):'—'}<\u002Ftd>\n      <td class=\"num\">${fmtPct(r.hook)}<\u002Ftd>\n      <td class=\"num\">${fmtPct(r.hold)}<\u002Ftd>\n    <\u002Ftr>`).join('');\n}\n\nfunction toggleSortCreative(col){\n  if(sortCreative.col===col){ sortCreative.dir = sortCreative.dir==='asc'?'desc':'asc'; }\n  else { sortCreative = {col, dir:'desc'}; }\n  render();\n}\n\nconst PIPELINE_COLS = [\n  {key:'proposalId', label:'Nº Proposta'}, {key:'name', label:'Nome'}, {key:'vehicle', label:'Descrição'}, {key:'year', label:'Ano/Ref.'},\n  {key:'type', label:'Tipo'}, {key:'value', label:'Valor mensal'}, {key:'city', label:'Cidade'},\n  {key:'criativo', label:'Criativo'}, {key:'status', label:'Status'}, {key:'date', label:'Data'}\n];\nfunction renderStatusCounts(orcamentos){\n  const box = document.getElementById('statusCounts');\n  const counts = {Pendente:0, 'Aguardando vistoria':0, Fechado:0, Perdido:0};\n  orcamentos.forEach(o=>{ if(counts[o.status]!=null) counts[o.status]++; });\n  const cls = {'Pendente':'pendente','Aguardando vistoria':'vistoria','Fechado':'fechado','Perdido':'perdido'};\n  box.innerHTML = Object.keys(counts).map(k=>\n    `<div class=\"status-count\"><span class=\"status-pill ${cls[k]}\">${k}<\u002Fspan><b>${counts[k]}<\u002Fb><\u002Fdiv>`\n  ).join('');\n}\n\nfunction renderMonthlySummary(orcamentos){\n  const box = document.getElementById('monthlySummaryBox');\n  if(orcamentos.length===0){ box.innerHTML = '<div class=\"empty-note\">Sem orçamentos no período<\u002Fdiv>'; return; }\n  const byMonth = {};\n  orcamentos.forEach(o=>{\n    const key = monthKey(o.date);\n    if(!byMonth[key]) byMonth[key] = {total:0, fechados:0, valorFechado:0, valorTotal:0};\n    byMonth[key].total++;\n    byMonth[key].valorTotal += o.value;\n    if(o.status==='Fechado'){ byMonth[key].fechados++; byMonth[key].valorFechado += o.value; }\n  });\n  const keys = Object.keys(byMonth).sort();\n  const rows = keys.map(k=>{\n    const [y,m] = k.split('-');\n    const label = MONTH_ABBR[parseInt(m)-1] + '/' + y;\n    const b = byMonth[k];\n    return `<tr>\n      <td>${label}<\u002Ftd>\n      <td class=\"num\">${b.total}<\u002Ftd>\n      <td class=\"num hl\">${b.fechados}<\u002Ftd>\n      <td class=\"num\">${fmtBRL(b.valorFechado)}<\u002Ftd>\n      <td class=\"num\">${fmtBRL(b.valorTotal)}<\u002Ftd>\n    <\u002Ftr>`;\n  }).join('');\n  box.innerHTML = `<table>\n    <thead><tr><th>Mês<\u002Fth><th>Orçamentos<\u002Fth><th>Fechados<\u002Fth><th>Valor fechado/mês<\u002Fth><th>Valor total/mês (se tudo fechar)<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>${rows}<\u002Ftbody>\n  <\u002Ftable>`;\n}\n\nfunction renderPipelineTable(rows){\n  const head = document.getElementById('pipelineHead');\n  head.innerHTML = PIPELINE_COLS.map(c=>{\n    const ind = sortPipeline.col===c.key ? (sortPipeline.dir==='asc'?'▲':'▼') : '';\n    return `<th onclick=\"toggleSortPipeline('${c.key}')\">${c.label} <span class=\"arrow-ind\">${ind}<\u002Fspan><\u002Fth>`;\n  }).join('') + '<th><\u002Fth>';\n\n  const searchTerm = (document.getElementById('pipelineSearch').value||'').toLowerCase();\n  const filtered = searchTerm ? rows.filter(r=>\n    r.name.toLowerCase().includes(searchTerm) || (r.vehicle||'').toLowerCase().includes(searchTerm)\n  ) : rows;\n\n  const sorted = sortRows(filtered, sortPipeline.col, sortPipeline.dir);\n  const body = document.getElementById('pipelineBody');\n  if(sorted.length===0){ body.innerHTML = '<tr><td colspan=\"10\" class=\"empty-note\">Nenhum orçamento encontrado<\u002Ftd><\u002Ftr>'; return; }\n  const statusOptions = ['Pendente','Aguardando vistoria','Fechado','Perdido'];\n  body.innerHTML = sorted.map((r)=>{\n    const realIdx = getCurrentClient().orcamentos.indexOf(r);\n    const statusClass = {'Fechado':'fechado','Pendente':'pendente','Aguardando vistoria':'vistoria','Perdido':'perdido'}[r.status]||'pendente';\n    const options = statusOptions.map(s=>`<option value=\"${s}\" ${s===r.status?'selected':''}>${s}<\u002Foption>`).join('');\n    return `<tr class=\"${r.status==='Fechado'?'row-fechado':''}\">\n      <td class=\"num\">${r.proposalId||'—'}<\u002Ftd>\n      <td class=\"name-cell\">${r.name}<\u002Ftd>\n      <td>${r.vehicle}<\u002Ftd>\n      <td class=\"num\">${r.year||'—'}<\u002Ftd>\n      <td>${r.type}<\u002Ftd>\n      <td class=\"num\">${fmtBRL(r.value)}<\u002Ftd>\n      <td>${r.city||'—'}<\u002Ftd>\n      <td><select class=\"status-select ${statusClass}\" onchange=\"updateOrcamentoStatus(${realIdx}, this.value)\">${options}<\u002Fselect><\u002Ftd>\n      <td><span style=\"font-size:11px;max-width:120px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\" title=\"${r.criativo||''}\">${r.criativo||'—'}<\u002Fspan><\u002Ftd>\n      <td class=\"num\">${r.date}<\u002Ftd>\n      <td><span class=\"row-del\" onclick=\"deleteOrcamento(${realIdx})\">✕<\u002Fspan><\u002Ftd>\n    <\u002Ftr>`;\n  }).join('');\n}\nfunction updateOrcamentoStatus(idx, newStatus){\n  getCurrentClient().orcamentos[idx].status = newStatus;\n  saveData(); render();\n}\nfunction toggleSortPipeline(col){\n  if(sortPipeline.col===col){ sortPipeline.dir = sortPipeline.dir==='asc'?'desc':'asc'; }\n  else { sortPipeline = {col, dir:'desc'}; }\n  render();\n}\n\nfunction filtrarCriativoOrc(query){\n  const list = document.getElementById('o_criativo_list');\n  if(!list) return;\n  const names = [...new Set(getCurrentClient().anuncios.map(a=>a.name).filter(Boolean))].sort();\n  const q = (query||'').toLowerCase();\n  const matches = q ? names.filter(n=>n.toLowerCase().includes(q)) : names;\n  if(!matches.length){ list.style.display='none'; return; }\n  list.innerHTML = matches.map(n=>\n    '<div onmousedown=\"document.getElementById(\\'o_criativo\\').value=\\''+n.replace(/'/g,\"\\\\'\")+'\\';\\\ndocument.getElementById(\\'o_criativo_list\\').style.display=\\'none\\';\" \\\nstyle=\"padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);\" \\\nonmouseover=\"this.style.background=\\'var(--bg)\\'\" onmouseout=\"this.style.background=\\'\\'\">'+n+'<\u002Fdiv>'\n  ).join('');\n  list.style.display = 'block';\n}\n\nfunction renderCriativosVendas(orcamentos){\n  const box = document.getElementById('criativosVendasBox');\n  if(!box) return;\n  // Agrupa todos os orcamentos (não só fechados) por criativo de origem\n  const map = {};\n  orcamentos.forEach(o=>{\n    const key = o.criativo || '(sem criativo identificado)';\n    if(!map[key]) map[key] = {nome:key, total:0, fechados:0, valorTotal:0, leads:[]};\n    map[key].total++;\n    map[key].leads.push({name:o.name, status:o.status, value:o.value});\n    if(o.status==='Fechado'){ map[key].fechados++; map[key].valorTotal+=o.value||0; }\n  });\n  const grupos = Object.values(map).filter(g=>g.total>0).sort((a,b)=>b.fechados-a.fechados||b.total-a.total);\n  if(grupos.length===0||orcamentos.length===0){\n    box.innerHTML='<div class=\"criativo-empty\">Sem orçamentos com criativo identificado ainda.<br>Ao cadastrar um orçamento, selecione o criativo que gerou o lead.<\u002Fdiv>'; return;\n  }\n  box.innerHTML = grupos.map((g,i)=>{\n    const conv = g.total>0?(g.fechados/g.total*100).toFixed(0):0;\n    const pills = g.leads.map(l=>`<span class=\"criativo-lead-pill ${l.status==='Fechado'?'fechado':''}\">${l.name}${l.status==='Fechado'?' ✓':''}<\u002Fspan>`).join('');\n    return `<div class=\"criativo-vendas-card ${i===0&&g.fechados>0?'top':''}\">\n      <div class=\"criativo-vendas-top\">\n        <span class=\"criativo-vendas-nome\">${g.nome}<\u002Fspan>\n        <div class=\"criativo-vendas-stats\">\n          <span class=\"criativo-vendas-stat\">Leads: <b>${g.total}<\u002Fb><\u002Fspan>\n          <span class=\"criativo-vendas-stat\">Fechados: <b style=\"color:var(--red)\">${g.fechados}<\u002Fb><\u002Fspan>\n          <span class=\"criativo-vendas-stat\">Conversão: <b>${conv}%<\u002Fb><\u002Fspan>\n          ${g.fechados>0?`<span class=\"criativo-vendas-stat\">Receita: <b>${fmtBRL(g.valorTotal)}/mês<\u002Fb><\u002Fspan>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"criativo-vendas-leads\">${pills}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderCampaigns(anuncios){\n  const box = document.getElementById('campaignsBox');\n  const groups = {video:[], imagem:[]};\n  aggregateCreatives(anuncios).forEach(c=>{ if(groups[c.campaign]) groups[c.campaign].push(c); });\n  function campHTML(list, label, cls){\n    const totalLeads = list.reduce((s,c)=>s+c.leads,0);\n    const totalSpend = list.reduce((s,c)=>s+c.spend,0);\n    const cpl = totalLeads>0 ? totalSpend/totalLeads : 0;\n    const sorted = list.slice().sort((a,b)=>b.leads-a.leads);\n    const max = sorted.length ? Math.max(...sorted.map(c=>c.leads),1) : 1;\n    const rows = sorted.map(c=>{\n      const pct = Math.max((c.leads/max*100),2);\n      const dead = c.leads===0 && c.spend>0;\n      return `<div class=\"bar-row\">\n        <div class=\"bar-top\"><span class=\"name\">${c.name}<\u002Fspan><span class=\"stat\">${c.leads} leads · ${fmtBRL(c.spend)}<\u002Fspan><\u002Fdiv>\n        <div class=\"bar-track\"><div class=\"bar-fill ${dead?'dead':cls}\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join('');\n    return `<div class=\"campaign\">\n      <div class=\"ctop\">\n        <div><h3>${label}<\u002Fh3><span class=\"tag\">${list.length} criativos testados<\u002Fspan><\u002Fdiv>\n        <div class=\"cnum\"><div class=\"big\">${totalLeads}<\u002Fdiv><div class=\"small\">leads · ${fmtBRL(totalSpend)} · CPL ${fmtBRL(cpl)}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      ${rows || '<div class=\"empty-note\">Sem dados no período<\u002Fdiv>'}\n    <\u002Fdiv>`;\n  }\n  box.innerHTML = campHTML(groups.video,'Vídeos','vid') + campHTML(groups.imagem,'Imagens','img');\n}\n\nfunction isoWeek(dateStr){\n  const d = new Date(dateStr);\n  d.setHours(0,0,0,0);\n  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);\n  const week1 = new Date(d.getFullYear(),0,4);\n  const weekNo = 1 + Math.round(((d-week1)/86400000 - 3 + (week1.getDay()+6)%7)/7);\n  return d.getFullYear() + '-S' + String(weekNo).padStart(2,'0');\n}\nfunction monthKey(dateStr){\n  const d = new Date(dateStr);\n  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');\n}\n\nfunction renderTrend(anuncios){\n  const byKey = {};\n  anuncios.forEach(a=>{\n    let key, label;\n    if(trendGroup==='semana'){\n      key = isoWeek(a.dateStart); label = key;\n    } else if(trendGroup==='mes'){\n      key = monthKey(a.dateStart);\n      const [y,m] = key.split('-');\n      label = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(m)-1] + '/' + y.slice(2);\n    } else {\n      key = a.dateStart + '_' + (a.dateEnd||a.dateStart);\n      const fmt = d=>d.split('-').reverse().slice(0,2).join('/');\n      label = a.dateStart===a.dateEnd||!a.dateEnd ? fmt(a.dateStart) : fmt(a.dateStart)+'–'+fmt(a.dateEnd);\n    }\n    if(!byKey[key]) byKey[key] = {leads:0, spend:0, sortKey:a.dateStart, label};\n    byKey[key].leads += a.leads; byKey[key].spend += a.spend;\n  });\n  const keys = Object.keys(byKey).sort((a,b)=>byKey[a].sortKey.localeCompare(byKey[b].sortKey));\n  const chart = document.getElementById('trendChart');\n  const labels = document.getElementById('trendLabels');\n  if(keys.length===0){ chart.innerHTML = '<div class=\"empty-note\">Sem dados no período<\u002Fdiv>'; labels.innerHTML=''; return; }\n  const cpls = keys.map(k=> byKey[k].leads>0 ? byKey[k].spend/byKey[k].leads : 0);\n  const max = Math.max(...cpls, 1);\n  chart.innerHTML = keys.map((k,i)=>{\n    const h = Math.max((cpls[i]/max*100),6);\n    return `<div class=\"trend-col\"><div class=\"trend-bar\" style=\"height:${h}%\"><span class=\"val\">${cpls[i]>0?fmtBRL(cpls[i]):'—'}<\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n  }).join('');\n  labels.innerHTML = keys.map(k=>`<div class=\"trend-lbl\">${byKey[k].label}<\u002Fdiv>`).join('');\n}\n\nfunction renderSales(orcamentos){\n  const fechados = orcamentos.filter(o=>o.status==='Fechado');\n  const box = document.getElementById('salesBox');\n  document.getElementById('salesMeta').textContent = fechados.length + (fechados.length===1?' venda fechada':' vendas fechadas');\n  if(fechados.length===0){ box.innerHTML = '<div class=\"empty-note\" style=\"grid-column:1/-1;\">Nenhuma venda fechada no período selecionado<\u002Fdiv>'; return; }\n  box.innerHTML = fechados.map(v=>`\n    <div class=\"sale-card\">\n      <div class=\"city\">${v.city || 'Cidade não informada'}<\u002Fdiv>\n      <div class=\"car\">${v.vehicle}${v.year?' · '+v.year:''}<\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Valor mensal<\u002Fspan><span class=\"v hl\">${fmtBRL(v.value)}/mês<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Cliente<\u002Fspan><span class=\"v\">${v.name}<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Data<\u002Fspan><span class=\"v\">${v.date}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\nfunction checkStorageUsage(){\n  try{\n    const used = new Blob([JSON.stringify(DATA)]).size;\n    const estimatedLimit = 5 * 1024 * 1024; // conservative 5MB assumption\n    const pct = Math.min((used/estimatedLimit)*100, 100);\n    const warn = document.getElementById('storageWarning');\n    if(pct > 60){\n      warn.classList.add('show');\n      document.getElementById('storagePct').textContent = pct.toFixed(0)+'%';\n    } else {\n      warn.classList.remove('show');\n    }\n  }catch(e){}\n}\n\nfunction render(){\n  const client = getCurrentClient();\n  applyClientTheme(client);\n  const anuncios = getFilteredAnuncios();\n  const orcamentos = getFilteredOrcamentos();\n\n  const totalLeads = anuncios.reduce((s,a)=>s+a.leads,0);\n  const totalSpend = anuncios.reduce((s,a)=>s+a.spend,0);\n  const totalOrc = orcamentos.length;\n  const totalVendas = orcamentos.filter(o=>o.status==='Fechado').length;\n\n  document.getElementById('fLeads').textContent = totalLeads;\n  document.getElementById('fOrc').textContent = totalOrc;\n  document.getElementById('fVendas').textContent = totalVendas;\n  document.getElementById('fPct1').textContent = totalLeads>0 ? ((totalOrc/totalLeads)*100).toFixed(1)+'%' : '–';\n  document.getElementById('fPct2').textContent = totalOrc>0 ? ((totalVendas/totalOrc)*100).toFixed(1)+'%' : '–';\n  document.getElementById('fNote').textContent = (totalOrc-totalVendas) + ' orçamentos seguem em aberto no pipeline';\n\n  document.getElementById('kGasto').textContent = fmtBRL(totalSpend);\n  document.getElementById('kCPL').textContent = totalLeads>0 ? fmtBRL(totalSpend/totalLeads) : '—';\n  document.getElementById('kCPO').textContent = totalOrc>0 ? fmtBRL(totalSpend/totalOrc) : '—';\n  document.getElementById('kCPV').textContent = totalVendas>0 ? fmtBRL(totalSpend/totalVendas) : '—';\n\n  document.getElementById('finGasto').textContent = fmtBRL(totalSpend);\n  const vendasFechadas = orcamentos.filter(o=>o.status==='Fechado');\n  const receitaReal = vendasFechadas.reduce((s,o)=>s+o.value, 0);\n  document.getElementById('finReceita').textContent = fmtBRL(receitaReal);\n  document.getElementById('finReceita').className = 'fv pos';\n  const pendentesList = orcamentos.filter(o=>o.status!=='Fechado' && o.status!=='Perdido');\n  const potencialReal = pendentesList.reduce((s,o)=>s+o.value, 0);\n  document.getElementById('finPotencial').textContent = fmtBRL(potencialReal);\n  document.getElementById('finPotencialSub').textContent = pendentesList.length + ' orçamentos pendentes · soma das mensalidades, se todos fecharem';\n\n  renderTrend(anuncios);\n  renderCampaigns(anuncios);\n  renderCreativeTable(aggregateCreatives(anuncios));\n  renderSales(orcamentos);\n  renderStatusCounts(orcamentos);\n  renderMonthlySummary(orcamentos);\n  renderPipelineTable(orcamentos);\n  renderCriativosVendas(orcamentos);\n  document.getElementById('pipelineMeta').textContent = totalOrc + ' orçamentos no período selecionado';\n\n  if(filterFrom || filterTo){\n    document.getElementById('periodLabel').textContent = `— ${filterFrom||'início'} a ${filterTo||'hoje'}`;\n  } else {\n    document.getElementById('periodLabel').textContent = '— todos os períodos registrados';\n  }\n  checkStorageUsage();\n}\n\n/* ---------- PDF EXPORT: separate lightweight print document ---------- */\nfunction esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }\n\nfunction exportPDF(){\n  const c = getCurrentClient();\n  document.getElementById('pdf_comment').value = c.pdfComment || '';\n  document.getElementById('pdf_period').textContent = (filterFrom||filterTo) ? (brDate(filterFrom)||'início')+' a '+(brDate(filterTo)||'hoje') : 'todos os períodos registrados';\n  openModal('pdfOpts');\n}\nasync function pdfToDataURL(src){\n  if(!src) return '';\n  if(src.startsWith('data:')) return src;\n  try{ const b = await (await fetch(src)).blob(); return await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(''); fr.readAsDataURL(b); }); }catch(e){ return ''; }\n}\nfunction pdfTrend(an){\n  const by = {};\n  const spanDays = an.length ? (new Date(an.reduce((m,a)=>a.dateEnd>m?a.dateEnd:m, an[0].dateEnd||an[0].dateStart)) - new Date(an.reduce((m,a)=>a.dateStart<m?a.dateStart:m, an[0].dateStart)))/864e5 : 0;\n  const mode = spanDays > 75 ? 'mes' : 'registro';\n  an.forEach(a=>{\n    let key, label;\n    if(mode==='mes'){ key = monthKey(a.dateStart); const [y,m] = key.split('-'); label = MONTH_ABBR[parseInt(m)-1]+'/'+y.slice(2); }\n    else { key = a.dateStart+'_'+(a.dateEnd||a.dateStart); const f=d=>d.split('-').reverse().slice(0,2).join('/'); label = a.dateStart===a.dateEnd||!a.dateEnd ? f(a.dateStart) : f(a.dateStart)+'–'+f(a.dateEnd); }\n    if(!by[key]) by[key] = {leads:0, spend:0, s:a.dateStart, label};\n    by[key].leads += a.leads||0; by[key].spend += a.spend||0;\n  });\n  return Object.values(by).sort((a,b)=>a.s.localeCompare(b.s)).map(x=>({label:x.label, leads:x.leads, spend:x.spend, cpl: x.leads ? x.spend/x.leads : null}));\n}\n\nasync function generatePDF(){\n  const ck = id => document.getElementById(id).checked;\n  const o = { media:ck('po_media'), cri:ck('po_cri'), tab:ck('po_tab'), trend:ck('po_trend'), vendas:ck('po_vendas'), pipe:ck('po_pipe'), nomes:ck('po_nomes'), alert:ck('po_alert') };\n  const client = getCurrentClient();\n  const comment = document.getElementById('pdf_comment').value.trim();\n  client.pdfComment = comment; saveData();\n  closeModal('pdfOpts');\n  let ov = document.getElementById('pdfPreview');\n  if(!ov){\n    ov = document.createElement('div'); ov.id = 'pdfPreview';\n    ov.style.cssText = 'position:fixed;inset:0;z-index:400;background:rgba(10,10,10,.6);backdrop-filter:blur(6px);display:flex;flex-direction:column';\n    ov.innerHTML = '<div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0a0a0a;color:#fff;flex-wrap:wrap\"><b style=\"font-size:14px;font-weight:800;flex:1;min-width:180px\">Prévia do relatório<\u002Fb><span style=\"font-size:12px;color:#bdbdbd\">Na janela de impressão, escolha \"Salvar como PDF\"<\u002Fspan><button class=\"btn primary\" id=\"pdfPrintBtn\">Salvar PDF / Imprimir<\u002Fbutton><button class=\"btn dark\" id=\"pdfCloseBtn\">Fechar<\u002Fbutton><\u002Fdiv><iframe id=\"pdfFrame\" style=\"flex:1;border:0;width:100%;background:#e9e9e9\"><\u002Fiframe>';\n    document.body.appendChild(ov);\n    ov.querySelector('#pdfCloseBtn').onclick = ()=>{ ov.style.display='none'; };\n    ov.querySelector('#pdfPrintBtn').onclick = ()=>{ const f=document.getElementById('pdfFrame'); try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ alert('Não foi possível abrir a impressão aqui. Abra o arquivo direto no navegador e tente de novo.'); } };\n  }\n  ov.style.display = 'flex';\n  const frame = document.getElementById('pdfFrame');\n  frame.srcdoc = '<p style=\"font-family:sans-serif;padding:40px;color:#555\">Montando o relatório…<\u002Fp>';\n\n  const an = getFilteredAnuncios(), orc = getFilteredOrcamentos(), cr = aggregateCreatives(an);\n  const T = mediaTotals(an, cr);\n  const pr = prevRange(); let P = null, pOrc = [];\n  if(pr){ const pa = anunciosBetween(pr.from, pr.to); if(pa.length) P = mediaTotals(pa, aggregateCreatives(pa)); pOrc = client.orcamentos.filter(x=>x.date>=pr.from && x.date<=pr.to); }\n  const nO = orc.length, vendas = orc.filter(x=>x.status==='Fechado'), nV = vendas.length;\n  const cpl = T.leads ? T.spend/T.leads : null, cpo = nO ? T.spend/nO : null, cpv = nV ? T.spend/nV : null;\n  const meta = +client.cplMeta || 0;\n  const receita = vendas.reduce((s,x)=>s+(x.value||0),0);\n  const abertos = orc.filter(x=>x.status!=='Fechado' && x.status!=='Perdido');\n  const potencial = abertos.reduce((s,x)=>s+(x.value||0),0);\n  const period = (filterFrom||filterTo) ? (brDate(filterFrom)||'início')+' a '+(brDate(filterTo)||'hoje') : 'Todos os períodos registrados';\n  const today = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});\n  const logo = await pdfToDataURL((document.getElementById('pdfLogo')||{}).src);\n  const D = (cur, prev, lower) => { const h = deltaHTML(cur, prev, lower); return h ? h.replace(' vs anterior','') : ''; };\n\n  const kpi = (label, value, sub, extra, cls) => `<div class=\"k ${cls||''}\"><div class=\"kl\">${label}<\u002Fdiv><div class=\"kv\">${value}<\u002Fdiv>${sub?`<div class=\"ks\">${sub}<\u002Fdiv>`:''}${extra||''}<\u002Fdiv>`;\n  const metaHTML = meta ? `<div class=\"meta\"><i style=\"background:${cpl==null?'#9a9a9a':cpl<=meta?'#1f9d55':cpl<=meta*1.2?'#f6b119':'#e03131'}\"><\u002Fi>Meta ${fmtBRL(meta)}: ${cpl==null?'sem leads':cpl<=meta?'dentro da meta':cpl<=meta*1.2?'até 20% acima':'acima da meta'}<\u002Fdiv>` : '';\n\n  // destaques de criativos\n  const ranked = cr.filter(c=>c.leads>0).sort((a,b)=>b.leads-a.leads || (a.cpl||1e9)-(b.cpl||1e9)).slice(0,6);\n  const elig = cr.filter(c=>c.leads>=2 && c.cpl!=null);\n  const best = elig.length ? elig.reduce((m,c)=>c.cpl<m.cpl?c:m).name : null;\n  const highlights = ranked.map((c,i)=>{\n    const t = thumbCache[thumbKey(c.name)];\n    const tags = [];\n    if(i===0) tags.push('<span class=\"tg dark\">Mais leads<\u002Fspan>');\n    if(c.name===best) tags.push('<span class=\"tg y\">Melhor CPL<\u002Fspan>');\n    return `<div class=\"cv\">\n      <div class=\"cvm\">${t?`<img src=\"${t.src}\">`:`<div class=\"cvph\">${c.campaign==='imagem'?'Imagem':'Vídeo'}<\u002Fdiv>`}<div class=\"cvt\">${tags.join('')}<\u002Fdiv><\u002Fdiv>\n      <div class=\"cvb\"><div class=\"cvn\">${esc(c.name)}<\u002Fdiv>\n        <div class=\"cvg\"><div><b>${c.leads}<\u002Fb><span>Leads<\u002Fspan><\u002Fdiv><div><b>${c.cpl!=null?fmtBRL(c.cpl):'—'}<\u002Fb><span>CPL<\u002Fspan><\u002Fdiv><div><b>${fmtPct(c.ctrLink)}<\u002Fb><span>CTR link<\u002Fspan><\u002Fdiv><div><b>${fmtBRL0(c.spend)}<\u002Fb><span>Investido<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>`;\n  }).join('');\n\n  const creRows = sortRows(cr, 'leads', 'desc').map(r=>`<tr><td class=\"nm\">${esc(r.name)}<\u002Ftd><td>${r.campaign==='imagem'?'Imagem':'Vídeo'}<\u002Ftd><td class=\"n\">${r.leads}<\u002Ftd><td class=\"n\">${fmtBRL(r.spend)}<\u002Ftd><td class=\"n\">${r.cpl!=null?fmtBRL(r.cpl):'—'}<\u002Ftd><td class=\"n\">${fmtInt(r.impr)}<\u002Ftd><td class=\"n\">${r.cpm!=null?fmtBRL(r.cpm):'—'}<\u002Ftd><td class=\"n\">${fmtPct(r.ctrLink)}<\u002Ftd><td class=\"n\">${fmtNum(r.freq)}<\u002Ftd><td class=\"n\">${fmtPct(r.hook)}<\u002Ftd><\u002Ftr>`).join('');\n\n  const tr = pdfTrend(an), tmax = Math.max(1, ...tr.map(x=>x.cpl||0));\n  const trendHTML = tr.length ? `<div class=\"chart\">${tr.map((x,i)=>`<div class=\"cc\"><div class=\"cbw\"><span class=\"cval\">${x.cpl!=null?fmtBRL(x.cpl):'—'}<\u002Fspan><div class=\"cb ${i===tr.length-1?'last':''}\" style=\"height:${Math.max(4,(x.cpl||0)/tmax*100)}%\"><\u002Fdiv><\u002Fdiv><div class=\"clab\">${x.label}<\u002Fdiv><div class=\"cl2\">${x.leads} leads<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>` : '<p class=\"empty\">Sem dados no período.<\u002Fp>';\n\n  const groups = {video:cr.filter(c=>c.campaign!=='imagem'), imagem:cr.filter(c=>c.campaign==='imagem')};\n  const campCard = (l, list) => { const le=list.reduce((s,c)=>s+c.leads,0), sp=list.reduce((s,c)=>s+c.spend,0); return `<div class=\"camp\"><div class=\"kl\">${l}<\u002Fdiv><div class=\"kv\">${le} leads<\u002Fdiv><div class=\"ks\">${fmtBRL(sp)} investidos · CPL ${le?fmtBRL(sp/le):'—'} · ${list.length} criativos<\u002Fdiv><\u002Fdiv>`; };\n\n  const alerts = o.alert ? alertsList(cr, T, meta) : [];\n\n  const salesHTML = vendas.length ? `<div class=\"sales\">${vendas.map(v=>`<div class=\"sale\"><div class=\"sc\">${esc(v.city||'Cidade não informada')}<\u002Fdiv><div class=\"sv\">${esc(v.vehicle||'')}${v.year?' · '+v.year:''}<\u002Fdiv><div class=\"sr\"><span>Mensalidade<\u002Fspan><b>${fmtBRL(v.value)}<\u002Fb><\u002Fdiv>${o.nomes?`<div class=\"sr\"><span>Cliente<\u002Fspan><b>${esc(v.name)}<\u002Fb><\u002Fdiv>`:''}<div class=\"sr\"><span>Data<\u002Fspan><b>${brDate(v.date)}<\u002Fb><\u002Fdiv>${v.criativo?`<div class=\"sr\"><span>Criativo<\u002Fspan><b>${esc(v.criativo)}<\u002Fb><\u002Fdiv>`:''}<\u002Fdiv>`).join('')}<\u002Fdiv>` : '<p class=\"empty\">Nenhuma venda fechada no período.<\u002Fp>';\n\n  const st = {Pendente:0,'Aguardando vistoria':0,Fechado:0,Perdido:0}; orc.forEach(x=>{ if(st[x.status]!=null) st[x.status]++; });\n  const stCls = {Pendente:'pe','Aguardando vistoria':'vi',Fechado:'fe',Perdido:'pd'};\n  const byMonth = {}; orc.forEach(x=>{ const k=monthKey(x.date); (byMonth[k]=byMonth[k]||{t:0,f:0,vf:0}); byMonth[k].t++; if(x.status==='Fechado'){ byMonth[k].f++; byMonth[k].vf+=x.value||0; } });\n  const monthRows = Object.keys(byMonth).sort().map(k=>{ const [y,m]=k.split('-'); const b=byMonth[k]; return `<tr><td>${MONTH_ABBR[parseInt(m)-1]}/${y}<\u002Ftd><td class=\"n\">${b.t}<\u002Ftd><td class=\"n\">${b.f}<\u002Ftd><td class=\"n\">${b.t?Math.round(b.f/b.t*100)+'%':'—'}<\u002Ftd><td class=\"n\">${fmtBRL(b.vf)}<\u002Ftd><\u002Ftr>`; }).join('');\n  const pipeNames = o.nomes ? orc.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<tr><td class=\"nm\">${esc(x.name)}<\u002Ftd><td>${esc(x.vehicle||'')}<\u002Ftd><td>${esc(x.city||'—')}<\u002Ftd><td class=\"n\">${fmtBRL(x.value)}<\u002Ftd><td><span class=\"pill ${stCls[x.status]||'pe'}\">${esc(x.status)}<\u002Fspan><\u002Ftd><td class=\"n\">${brDate(x.date)}<\u002Ftd><\u002Ftr>`).join('') : '';\n\n  const sec = (num, title, body, brk) => `<section class=\"sec ${brk?'brk':''}\"><div class=\"sh\"><span class=\"sn\">${num}<\u002Fspan><h2>${title}<\u002Fh2><\u002Fdiv>${body}<\u002Fsection>`;\n  let n = 0; const N = () => String(++n).padStart(2,'0');\n  const parts = [];\n  parts.push(sec(N(), 'Resumo do período', `\n    <div class=\"funnel\">\n      <div class=\"fs\"><div class=\"fn\">${T.leads}<\u002Fdiv><div class=\"fl\">Leads no WhatsApp<\u002Fdiv><\u002Fdiv>\n      <div class=\"fa\">${T.leads?((nO/T.leads)*100).toFixed(1).replace('.',',')+'%':'—'}<span>→<\u002Fspan><\u002Fdiv>\n      <div class=\"fs y\"><div class=\"fn\">${nO}<\u002Fdiv><div class=\"fl\">Orçamentos enviados<\u002Fdiv><\u002Fdiv>\n      <div class=\"fa\">${nO?((nV/nO)*100).toFixed(1).replace('.',',')+'%':'—'}<span>→<\u002Fspan><\u002Fdiv>\n      <div class=\"fs g\"><div class=\"fn\">${nV}<\u002Fdiv><div class=\"fl\">Vendas fechadas<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"kg4\">\n      ${kpi('Investido', fmtBRL(T.spend), 'Meta Ads', P?D(T.spend,P.spend,null):'', 'dk')}\n      ${kpi('Custo por lead', cpl!=null?fmtBRL(cpl):'—', '', (P?D(cpl,P.leads?P.spend/P.leads:null,true):'')+metaHTML)}\n      ${kpi('Custo por orçamento', cpo!=null?fmtBRL(cpo):'—', '', P&&pOrc.length?D(cpo,P.spend/pOrc.length,true):'')}\n      ${kpi('Custo por venda', cpv!=null?fmtBRL(cpv):'—', '', '')}\n    <\u002Fdiv>\n    <div class=\"fin\">\n      <div><div class=\"kl\">Receita gerada<\u002Fdiv><div class=\"kv\">${fmtBRL(receita)}<small>/mês<\u002Fsmall><\u002Fdiv><div class=\"ks\">mensalidades das vendas fechadas<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"kl\">Pipeline em aberto<\u002Fdiv><div class=\"kv\">${fmtBRL(potencial)}<small>/mês<\u002Fsmall><\u002Fdiv><div class=\"ks\">${abertos.length} orçamentos pendentes, se todos fecharem<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"kl\">Retorno sobre o investido<\u002Fdiv><div class=\"kv\">${T.spend?(receita/T.spend).toFixed(1).replace('.',','):'—'}<small>x<\u002Fsmall><\u002Fdiv><div class=\"ks\">receita mensal ÷ investido no período<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    ${comment?`<div class=\"note\"><div class=\"kl\">Análise da Beekeeper<\u002Fdiv><p>${esc(comment).replace(/\\n/g,'<br>')}<\u002Fp><\u002Fdiv>`:''}\n  `));\n  if(o.media) parts.push(sec(N(), 'Métricas de mídia', `<div class=\"kg\">${[\n      ['Impressões', fmtInt(T.impr), 'vezes que os anúncios apareceram', P?D(T.impr,P.impr,false):''],\n      ['Alcance', fmtInt(T.reach), 'pessoas alcançadas', P?D(T.reach,P.reach,false):''],\n      ['Frequência', fmtNum(T.freq), 'vezes que cada pessoa viu', ''],\n      ['CPM', T.cpm!=null?fmtBRL(T.cpm):'—', 'custo por mil impressões', P?D(T.cpm,P.cpm,true):''],\n      ['CTR (link)', fmtPct(T.ctrLink), 'cliques no botão ÷ impressões', P?D(T.ctrLink,P.ctrLink,false):''],\n      ['CPC', T.cpc!=null?fmtBRL(T.cpc):'—', 'custo por clique', P?D(T.cpc,P.cpc,true):''],\n      ['Hook rate', fmtPct(T.hook), 'assistiram 3s do vídeo', ''],\n      ['Hold rate', fmtPct(T.hold), 'continuaram até o ThruPlay', '']\n    ].filter(x=>x[1]!=='—').map(x=>kpi(x[0],x[1],x[2],x[3])).join('')}<\u002Fdiv>\n    ${P?`<p class=\"cmp\">Variações comparadas com ${brDate(pr.from)} a ${brDate(pr.to)}.<\u002Fp>`:''}`));\n  if(o.cri && ranked.length) parts.push(sec(N(), 'Criativos em destaque', `<div class=\"cvs\">${highlights}<\u002Fdiv>`, true));\n  if(o.trend) parts.push(sec(N(), 'Evolução do custo por lead', trendHTML + `<div class=\"camps\">${campCard('Vídeos', groups.video)}${campCard('Imagens', groups.imagem)}<\u002Fdiv>`, !(o.cri && ranked.length)));\n  if(o.tab && cr.length) parts.push(sec(N(), 'Desempenho por criativo', `<table><thead><tr><th>Criativo<\u002Fth><th>Tipo<\u002Fth><th>Leads<\u002Fth><th>Investido<\u002Fth><th>CPL<\u002Fth><th>Impr.<\u002Fth><th>CPM<\u002Fth><th>CTR link<\u002Fth><th>Freq.<\u002Fth><th>Hook<\u002Fth><\u002Ftr><\u002Fthead><tbody>${creRows}<\u002Ftbody><\u002Ftable>`));\n  if(o.vendas) parts.push(sec(N(), 'Vendas fechadas', salesHTML, true));\n  if(o.pipe) parts.push(sec(N(), 'Pipeline de orçamentos', `\n    <div class=\"sts\">${Object.keys(st).map(k=>`<div class=\"stc\"><span class=\"pill ${stCls[k]}\">${k}<\u002Fspan><b>${st[k]}<\u002Fb><\u002Fdiv>`).join('')}<\u002Fdiv>\n    ${monthRows?`<table><thead><tr><th>Mês<\u002Fth><th>Orçamentos<\u002Fth><th>Fechados<\u002Fth><th>Conversão<\u002Fth><th>Receita fechada/mês<\u002Fth><\u002Ftr><\u002Fthead><tbody>${monthRows}<\u002Ftbody><\u002Ftable>`:''}\n    ${pipeNames?`<h3>Todos os orçamentos<\u002Fh3><table><thead><tr><th>Nome<\u002Fth><th>Descrição<\u002Fth><th>Cidade<\u002Fth><th>Mensalidade<\u002Fth><th>Status<\u002Fth><th>Data<\u002Fth><\u002Ftr><\u002Fthead><tbody>${pipeNames}<\u002Ftbody><\u002Ftable>`:''}`));\n  if(o.alert && alerts.length) parts.push(sec(N(), 'Leitura e próximos passos', `<div class=\"als\">${alerts.map(a=>`<div class=\"al\"><i style=\"background:${a[0]}\"><\u002Fi><span>${a[1]}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv>`));\n\n  const accent = client.accent || '#f6b119';\n  const html = `<!DOCTYPE html><html lang=\"pt-BR\"><head><meta charset=\"UTF-8\"><title>${esc(client.name)} — Relatório de campanha<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap\">\n<style>\n@page{ size:A4; margin:14mm 14mm 16mm; }\n*{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }\nbody{ margin:0; font-family:'Montserrat',Arial,sans-serif; color:#0a0a0a; font-size:10.5pt; font-weight:500; background:#fff; }\n.cover{ height:265mm; background:#0a0a0a; color:#fff; border-radius:6mm; padding:16mm 14mm; display:flex; flex-direction:column; position:relative; overflow:hidden; break-after:page; }\n.cover .lg{ width:58mm; border-radius:3mm; display:block; }\n.cover .stripe{ position:absolute; left:0; right:0; bottom:0; height:4mm; background:#f6b119; }\n.cover .ey{ margin-top:auto; font-size:9pt; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:#f6b119; display:flex; align-items:center; gap:3mm; }\n.cover .ey i{ width:3mm; height:3mm; border-radius:50%; background:${accent}; display:inline-block; }\n.cover h1{ font-size:34pt; line-height:1.05; font-weight:800; margin:4mm 0 3mm; letter-spacing:-.01em; }\n.cover .st{ font-size:12pt; color:#bdbdbd; font-weight:600; max-width:140mm; line-height:1.45; }\n.cover .meta2{ display:flex; gap:12mm; margin-top:12mm; padding-top:6mm; border-top:1px solid rgba(255,255,255,.18); }\n.cover .meta2 div span{ display:block; font-size:7.5pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#8a8a8a; }\n.cover .meta2 div b{ display:block; font-size:11pt; margin-top:1.5mm; }\n.sec{ margin:0 0 9mm; }\n.sec.brk{ break-before:page; }\n.sh{ display:flex; align-items:baseline; gap:3mm; margin:0 0 5mm; padding-bottom:2.5mm; border-bottom:2px solid #0a0a0a; }\n.sn{ font-size:9pt; font-weight:800; color:#8a5d00; }\nh2{ font-size:15pt; font-weight:800; margin:0; }\nh3{ font-size:11pt; font-weight:800; margin:6mm 0 3mm; }\n.funnel{ display:grid; grid-template-columns:1fr 18mm 1fr 18mm 1fr; align-items:center; margin-bottom:5mm; }\n.fs{ border-radius:3mm; background:#f4f4f4; padding:5mm; border-top:1.2mm solid #0a0a0a; }\n.fs.y{ border-top-color:#f6b119; } .fs.g{ border-top-color:#1f9d55; }\n.fn{ font-size:26pt; font-weight:800; line-height:1; } .fs.y .fn{ color:#8a5d00; } .fs.g .fn{ color:#1f9d55; }\n.fl{ font-size:7.5pt; font-
